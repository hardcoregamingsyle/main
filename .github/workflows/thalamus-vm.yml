# Managed by Thalamus. Persistent VM worker — polls for queued commands.
name: Thalamus VM

on:
  workflow_dispatch:
    inputs:
      branch_id:
        description: Convex branch id
        required: true
      vm_nonce:
        description: One-time token proving this worker is ours
        required: true
      callback_base:
        description: Convex site base URL
        required: true
      os:
        description: Runner to execute on
        required: false
        default: ubuntu-latest
      branch:
        description: Git branch to track and re-sync against
        required: true

jobs:
  vm:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm test
      - run: npm start & sleep infinity
