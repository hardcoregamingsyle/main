<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 50,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Pipes array
        let pipes = [];
        let pipeGap = 150;
        let pipeWidth = 60;
        let pipeSpeed = 3;
        
        // Ground properties
        const ground = {
            height: 80
        };
        
        // Background elements
        const clouds = [
            { x: 100, y: 80, width: 60, height: 30 },
            { x: 300, y: 120, width: 80, height: 40 },
            { x: 200, y: 50, width: 70, height: 35 }
        ];
        
        // Draw girl character
        function drawGirl() {
            // Simple girl representation using shapes
            ctx.fillStyle = '#FF69B4'; // Pink dress
            ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
            
            // Head
            ctx.fillStyle = '#FFD700'; // Yellow skin
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair
            ctx.fillStyle = '#8B4513'; // Brown hair
            ctx.beginPath();
            ctx.moveTo(girl.x + 5, girl.y - 10);
            ctx.lineTo(girl.x + 15, girl.y - 25);
            ctx.lineTo(girl.x + 25, girl.y - 10);
            ctx.closePath();
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + 12, girl.y - 12, 3, 0, Math.PI * 2);
            ctx.arc(girl.x + 22, girl.y - 12, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.beginPath();
            ctx.arc(girl.x + 17, girl.y - 5, 5, 0, Math.PI);
            ctx.stroke();
        }
        
        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillStyle = '#228B22'; // Green pipe
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Pipe cap
                ctx.fillStyle = '#006400'; // Darker green
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                
                // Bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height - pipe.topHeight - pipeGap);
                
                // Pipe cap
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.topHeight + pipeGap, pipeWidth + 10, 20);
            });
        }
        
        // Draw background elements
        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            ctx.fillStyle = 'white';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.width/4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/4, cloud.y - cloud.height/4, cloud.width/5, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/2, cloud.y, cloud.width/4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/1.5, cloud.y - cloud.height/4, cloud.width/5, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - ground.height, canvas.width, ground.height);
            
            // Grass
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, canvas.height - ground.height, canvas.width, 10);
        }
        
        // Update girl position
        function updateGirl() {
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Floor collision
            if (girl.y + girl.height >= canvas.height - ground.height) {
                girl.y = canvas.height - ground.height - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y <= 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        // Generate new pipes
        function generatePipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - ground.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                passed: false
            });
        }
        
        // Update pipes
        function updatePipes() {
            // Move pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;
                
                // Check if girl passed the pipe
                if (!pipes[i].passed && pipes[i].x + pipeWidth < girl.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
                
                // Remove pipes that are off screen
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
                
                // Collision detection
                if (
                    girl.x + girl.width > pipes[i].x &&
                    girl.x < pipes[i].x + pipeWidth &&
                    (girl.y < pipes[i].topHeight ||
                     girl.y + girl.height > pipes[i].topHeight + pipeGap)
                ) {
                    gameOver();
                }
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes = [];
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            if (gameRunning) {
                // Update and draw girl
                updateGirl();
                drawGirl();
                
                // Update and draw pipes
                updatePipes();
                drawPipes();
                
                // Generate new pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                    generatePipe();
                }
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    resetGame();
                } else {
                    girl.velocity = girl.jump;
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                resetGame();
            } else {
                girl.velocity = girl.jump;
            }
        });
        
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
