<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-button">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Control the girl to avoid obstacles!</p>
            <p>Press SPACE or click to jump</p>
            <button id="start-button">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            radius: 20,
            velocity: 0,
            gravity: 0.5,
            lift: -10,
            draw: function() {
                // Draw girl body
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw girl hair
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(this.x, this.y - 15, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 8, this.y - 5, 4, 0, Math.PI * 2);
                ctx.arc(this.x + 8, this.y - 5, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw pupils
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x - 8, this.y - 5, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 8, this.y - 5, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y + 5, 8, 0, Math.PI);
                ctx.stroke();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    if (gameState === 'playing') {
                        gameOver();
                    }
                }
                
                // Ceiling collision
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.lift;
            }
        };
        
        // Obstacles
        const obstacles = [];
        let obstacleGap = 150;
        let obstacleSpeed = 3;
        let obstacleFrequency = 1500; // milliseconds
        let lastObstacleTime = 0;
        
        class Obstacle {
            constructor() {
                this.width = 60;
                this.x = canvas.width;
                this.topHeight = Math.floor(Math.random() * (canvas.height - obstacleGap - 100)) + 50;
                this.bottomY = this.topHeight + obstacleGap;
                this.bottomHeight = canvas.height - this.bottomY;
                this.passed = false;
            }
            
            draw() {
                // Top obstacle
                ctx.fillStyle = '#228B22';
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                
                // Bottom obstacle
                ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
                
                // Draw obstacle caps
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 20);
            }
            
            update() {
                this.x -= obstacleSpeed;
                
                // Check if passed
                if (!this.passed && this.x + this.width < girl.x) {
                    this.passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            }
            
            isOffScreen() {
                return this.x + this.width < 0;
            }
            
            collidesWith(girl) {
                // Simple collision detection
                return (
                    girl.x + girl.radius > this.x &&
                    girl.x - girl.radius < this.x + this.width &&
                    (girl.y - girl.radius < this.topHeight ||
                     girl.y + girl.radius > this.bottomY)
                );
            }
        }
        
        // Game functions
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            obstacles.length = 0;
            lastObstacleTime = 0;
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function gameLoop(timestamp) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            if (gameState === 'playing') {
                // Update and draw girl
                girl.update();
                girl.draw();
                
                // Generate obstacles
                if (timestamp - lastObstacleTime > obstacleFrequency) {
                    obstacles.push(new Obstacle());
                    lastObstacleTime = timestamp;
                }
                
                // Update and draw obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();
                    
                    // Remove off-screen obstacles
                    if (obstacles[i].isOffScreen()) {
                        obstacles.splice(i, 1);
                    }
                    
                    // Check collisions
                    if (obstacles[i].collidesWith(girl)) {
                        gameOver();
                    }
                }
                
                // Continue game loop
                requestAnimationFrame(gameLoop);
            }
        }
        
        function drawBackground() {
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
            
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(120, 70, 25, 0, Math.PI * 2);
            ctx.arc(140, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(320, 110, 25, 0, Math.PI * 2);
            ctx.arc(340, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Event listeners
        canvas.addEventListener('click', function() {
            if (gameState === 'playing') {
                girl.flap();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameState === 'playing') {
                    girl.flap();
                } else if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'gameover') {
                    startGame();
                }
            }
        });
        
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        
        // Initialize game
        drawBackground();
    </script>
</body>
</html>
