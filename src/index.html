<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScore = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Pipes array
        let pipes = [];
        
        // Pipe properties
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Generate a random pipe height
        function generatePipeHeight() {
            return Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 50;
        }
        
        // Draw the girl character
        function drawGirl(x, y, width, height) {
            // Simple representation of a girl with hair and dress
            ctx.fillStyle = '#FF69B4'; // Pink dress
            ctx.fillRect(x, y, width, height);
            
            // Hair
            ctx.fillStyle = '#8B4513'; // Brown hair
            ctx.beginPath();
            ctx.arc(x + width/2, y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Face
            ctx.fillStyle = '#FFDAB9'; // Skin tone
            ctx.beginPath();
            ctx.arc(x + width/2, y + 10, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(x + width/2 - 3, y + 8, 2, 0, Math.PI * 2);
            ctx.arc(x + width/2 + 3, y + 8, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x + width/2, y + 15, 4, 0, Math.PI);
            ctx.stroke();
        }
        
        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillStyle = '#228B22'; // Green pipes
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Pipe cap
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                
                // Bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height);
                
                // Pipe cap
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.topHeight + pipeGap, pipeWidth + 10, 20);
            });
        }
        
        // Update girl position
        function updateGirl() {
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Floor collision
            if (girl.y + girl.height >= canvas.height) {
                girl.y = canvas.height - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y <= 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        // Update pipes
        function updatePipes() {
            // Move pipes to the left
            pipes.forEach(pipe => {
                pipe.x -= pipeSpeed;
            });
            
            // Remove pipes that are off screen
            pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
            
            // Add new pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                const topHeight = generatePipeHeight();
                pipes.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    passed: false
                });
            }
        }
        
        // Check collisions
        function checkCollisions() {
            const girlRect = {
                x: girl.x,
                y: girl.y,
                width: girl.width,
                height: girl.height
            };
            
            for (let i = 0; i < pipes.length; i++) {
                const pipe = pipes[i];
                
                const topPipeRect = {
                    x: pipe.x,
                    y: 0,
                    width: pipeWidth,
                    height: pipe.topHeight
                };
                
                const bottomPipeRect = {
                    x: pipe.x,
                    y: pipe.topHeight + pipeGap,
                    width: pipeWidth,
                    height: canvas.height - (pipe.topHeight + pipeGap)
                };
                
                // Collision detection
                if (
                    girlRect.x < topPipeRect.x + topPipeRect.width &&
                    girlRect.x + girlRect.width > topPipeRect.x &&
                    girlRect.y < topPipeRect.y + topPipeRect.height &&
                    girlRect.y + girlRect.height > topPipeRect.y
                ) {
                    gameOver();
                }
                
                if (
                    girlRect.x < bottomPipeRect.x + bottomPipeRect.width &&
                    girlRect.x + girlRect.width > bottomPipeRect.x &&
                    girlRect.y < bottomPipeRect.y + bottomPipeRect.height &&
                    girlRect.y + girlRect.height > bottomPipeRect.y
                ) {
                    gameOver();
                }
                
                // Score when passing through pipes
                if (!pipe.passed && pipe.x + pipeWidth < girl.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScore.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes = [];
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        // Draw background elements
        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            if (gameRunning) {
                // Update game objects
                updateGirl();
                updatePipes();
                checkCollisions();
                
                // Draw pipes
                drawPipes();
                
                // Draw girl
                drawGirl(girl.x, girl.y, girl.width, girl.height);
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Handle user input
        function flap() {
            if (gameRunning) {
                girl.velocity = girl.jump;
            } else if (!gameOverScreen.style.display || gameOverScreen.style.display === 'none') {
                resetGame();
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                flap();
            }
        });
        
        canvas.addEventListener('click', flap);
        
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
