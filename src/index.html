<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 50,
            velocity: 0,
            gravity: 0.5,
            jump: -10,
            draw: function() {
                // Draw girl body
                ctx.fillStyle = '#FF69B4'; // Pink color
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw girl head
                ctx.fillStyle = '#FFD700'; // Yellow color
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw girl hair
                ctx.fillStyle = '#8B4513'; // Brown color
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y - 10);
                ctx.lineTo(this.x + 15, this.y - 25);
                ctx.lineTo(this.x + 25, this.y - 20);
                ctx.lineTo(this.x + 35, this.y - 15);
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x + 12, this.y - 15, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 28, this.y - 15, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw pupils
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 12, this.y - 15, 1.5, 0, Math.PI * 2);
                ctx.arc(this.x + 28, this.y - 15, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 5, 5, 0, Math.PI);
                ctx.stroke();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - 50) {
                    this.y = canvas.height - 50 - this.height;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };
        
        // Pipes array
        const pipes = [];
        
        // Pipe properties
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Create a new pipe
        function createPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight - 50;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                bottomHeight: canvas.height - (topHeight + pipeGap) - 50,
                passed: false,
                draw: function() {
                    // Draw top pipe
                    ctx.fillStyle = '#228B22'; // Green color
                    ctx.fillRect(this.x, 0, pipeWidth, this.topHeight);
                    
                    // Draw pipe cap
                    ctx.fillStyle = '#006400'; // Dark green
                    ctx.fillRect(this.x - 5, this.topHeight - 20, pipeWidth + 10, 20);
                    
                    // Draw bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(this.x, this.bottomY, pipeWidth, this.bottomHeight);
                    
                    // Draw pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(this.x - 5, this.bottomY, pipeWidth + 10, 20);
                },
                update: function() {
                    this.x -= pipeSpeed;
                },
                isOffScreen: function() {
                    return this.x + pipeWidth < 0;
                },
                checkCollision: function() {
                    // Check collision with top pipe
                    if (
                        girl.x + girl.width > this.x &&
                        girl.x < this.x + pipeWidth &&
                        girl.y < this.topHeight
                    ) {
                        return true;
                    }
                    
                    // Check collision with bottom pipe
                    if (
                        girl.x + girl.width > this.x &&
                        girl.x < this.x + pipeWidth &&
                        girl.y + girl.height > this.bottomY
                    ) {
                        return true;
                    }
                    
                    return false;
                }
            });
        }
        
        // Draw ground
        function drawGround() {
            ctx.fillStyle = '#8B4513'; // Brown color
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Draw grass
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 10);
        }
        
        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            // Cloud 1
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(120, 70, 25, 0, Math.PI * 2);
            ctx.arc(140, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Cloud 2
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(320, 110, 25, 0, Math.PI * 2);
            ctx.arc(340, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Update score
        function updateScore() {
            for (let i = 0; i < pipes.length; i++) {
                if (!pipes[i].passed && pipes[i].x + pipeWidth < girl.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes.length = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sky background
            drawClouds();
            
            // Draw pipes
            for (let i = 0; i < pipes.length; i++) {
                pipes[i].draw();
                pipes[i].update();
                
                // Check for collisions
                if (pipes[i].checkCollision()) {
                    gameOver();
                }
                
                // Remove off-screen pipes
                if (pipes[i].isOffScreen()) {
                    pipes.splice(i, 1);
                    i--;
                }
            }
            
            // Draw ground
            drawGround();
            
            // Draw girl
            girl.draw();
            
            if (gameRunning) {
                girl.update();
                updateScore();
                
                // Generate new pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                    createPipe();
                }
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    resetGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                resetGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
