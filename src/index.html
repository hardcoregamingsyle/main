<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Control the girl to avoid obstacles!</p>
            <p>Press SPACE or CLICK to jump</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        let frames = 0;
        
        // Load images
        const girlImg = new Image();
        girlImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+CiAgPGNpcmNsZSBjeD0iNTAiIGN5PSIzMCIgcj0iMTUiIGZpbGw9IiMwMDgiLz4KICA8cmVjdCB4PSIzNSIgeT0iNTAiIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgZmlsbD0iIzAwOCIgcmluZz0iNSIvPgogIDxyZWN0IHg9IjMwIiB5PSI5MCIgd2lkdGg9IjQwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMDA4IiByaW5nPSI1Ii8+Cjwvc3ZnPg==';
        
        const obstacleTopImg = new Image();
        obstacleTopImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+CjxyZWN0IHg9IjAgI3k9IjAgd2lkdGg9IjEwMCIgaGVpZ2h0PSI1MCIgZmlsbD0iIzAwYjAwMCIvPgo8L3N2Zz4=';
        
        const obstacleBottomImg = new Image();
        obstacleBottomImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+CjxyZWN0IHg9IjAgI3k9IjUwIiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjUwIiBmaWxsPSIjMDBiMDAwIi8+Cjwvc3ZnPg==';
        
        // Background elements
        const bgImg = new Image();
        bgImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjODdDRUIiLz4KPC9zdmc+';
        
        // Ground
        const groundImg = new Image();
        groundImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+CjxyZWN0IHg9IjAiIHk9IjgwIiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjRjJGNkY5Ii8+Cjwvc3ZnPg==';
        
        // Girl class
        class Girl {
            constructor() {
                this.x = 50;
                this.y = canvas.height / 2 - 10;
                this.width = 30;
                this.height = 30;
                this.gravity = 0.5;
                this.velocity = 0;
                this.jump = -10;
            }
            
            draw() {
                ctx.drawImage(girlImg, this.x, this.y, this.width, this.height);
            }
            
            update() {
                // Apply gravity
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - groundImg.height) {
                    this.y = canvas.height - groundImg.height - this.height;
                    if (gameState === 'playing') {
                        gameOver();
                    }
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            }
            
            flap() {
                this.velocity = this.jump;
            }
        }
        
        // Obstacle class
        class Obstacle {
            constructor() {
                this.x = canvas.width;
                this.width = 60;
                this.gap = 150;
                this.topHeight = Math.floor(Math.random() * (canvas.height - this.gap - 100)) + 50;
                this.bottomY = this.topHeight + this.gap;
                this.bottomHeight = canvas.height - this.bottomY;
                this.passed = false;
            }
            
            draw() {
                // Top obstacle
                ctx.drawImage(obstacleTopImg, this.x, 0, this.width, this.topHeight);
                
                // Bottom obstacle
                ctx.drawImage(obstacleBottomImg, this.x, this.bottomY, this.width, this.bottomHeight);
            }
            
            update() {
                this.x -= 2;
                
                // Check if passed
                if (!this.passed && this.x + this.width < girl.x) {
                    this.passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
            }
            
            isOffScreen() {
                return this.x + this.width < 0;
            }
            
            collidesWith(girl) {
                // Simple collision detection
                return (
                    girl.x + girl.width > this.x &&
                    girl.x < this.x + this.width &&
                    (girl.y < this.topHeight ||
                     girl.y + girl.height > this.bottomY)
                );
            }
        }
        
        // Create game objects
        const girl = new Girl();
        let obstacles = [];
        
        // Handle user input
        function handleInput() {
            if (gameState === 'playing') {
                girl.flap();
            } else if (gameState === 'start') {
                startGame();
            } else if (gameState === 'gameover') {
                resetGame();
            }
        }
        
        // Start game
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            obstacles = [];
        }
        
        // Game over
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            gameState = 'start';
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        }
        
        // Draw background
        function drawBackground() {
            // Sky
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            
            // Ground
            ctx.drawImage(groundImg, 0, canvas.height - groundImg.height, canvas.width, groundImg.height);
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            if (gameState === 'playing') {
                // Update and draw girl
                girl.update();
                girl.draw();
                
                // Generate obstacles
                if (frames % 100 === 0) {
                    obstacles.push(new Obstacle());
                }
                
                // Update and draw obstacles
                obstacles.forEach(obstacle => {
                    obstacle.update();
                    obstacle.draw();
                    
                    // Check collision
                    if (obstacle.collidesWith(girl)) {
                        gameOver();
                    }
                    
                    // Remove off-screen obstacles
                    if (obstacle.isOffScreen()) {
                        obstacles.shift();
                    }
                });
            } else if (gameState === 'start') {
                // Draw starting girl
                girl.draw();
            }
            
            frames++;
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        canvas.addEventListener('click', handleInput);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleInput();
            }
        });
        
        startBtn.addEventListener('click', handleInput);
        restartBtn.addEventListener('click', handleInput);
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
