<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-btn:hover {
            background: #45a049;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the pipes!
            <br>Press SPACE or click to make her fly.</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let frames = 0;
        
        // Girl properties
        const girl = {
            x: 50,
            y: canvas.height / 2 - 10,
            width: 30,
            height: 30,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            
            draw: function() {
                // Draw a simple girl character using shapes
                ctx.fillStyle = '#FF69B4'; // Pink hair
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y + 10, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw face
                ctx.fillStyle = '#FFDAB9'; // Skin tone
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y + 15, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 12, this.y + 13, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 18, this.y + 13, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y + 18, 4, 0, Math.PI);
                ctx.stroke();
                
                // Draw dress
                ctx.fillStyle = '#1E90FF'; // Blue dress
                ctx.fillRect(this.x, this.y + 20, this.width, 20);
                
                // Draw arms
                ctx.fillStyle = '#FFDAB9';
                ctx.fillRect(this.x - 5, this.y + 15, 5, 10);
                ctx.fillRect(this.x + 30, this.y + 15, 5, 10);
                
                // Draw legs
                ctx.fillStyle = '#8B0000'; // Red skirt
                ctx.fillRect(this.x + 5, this.y + 40, 10, 15);
                ctx.fillRect(this.x + 15, this.y + 40, 10, 15);
            },
            
            update: function() {
                // Apply gravity
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - ground.height) {
                    this.y = canvas.height - ground.height - this.height;
                    if (gameRunning) {
                        gameOver();
                    }
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            
            flap: function() {
                this.velocity = this.jump;
            },
            
            reset: function() {
                this.y = canvas.height / 2 - 10;
                this.velocity = 0;
            }
        };
        
        // Ground
        const ground = {
            height: 80,
            draw: function() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(0, canvas.height - this.height, canvas.width, this.height);
                
                // Draw grass
                ctx.fillStyle = '#228B22';
                ctx.fillRect(0, canvas.height - this.height, canvas.width, 10);
            }
        };
        
        // Pipes
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            
            update: function() {
                if (gameRunning) {
                    if (frames % 100 === 0) {
                        this.position.push({
                            x: canvas.width,
                            y: this.maxYPos * (Math.random() + 1),
                            width: 60,
                            height: 200
                        });
                    }
                    
                    for (let i = 0; i < this.position.length; i++) {
                        let p = this.position[i];
                        
                        // Move pipes to the left
                        p.x -= this.dx;
                        
                        // If pipe moves off screen, remove it
                        if (p.x + p.width <= 0) {
                            this.position.shift();
                            score++;
                            scoreDisplay.textContent = 'Score: ' + score;
                        }
                        
                        // Collision detection
                        // Top pipe
                        if (
                            girl.x + girl.width > p.x &&
                            girl.x < p.x + p.width &&
                            girl.y < p.y + p.height
                        ) {
                            gameOver();
                        }
                        
                        // Bottom pipe
                        if (
                            girl.x + girl.width > p.x &&
                            girl.x < p.x + p.width &&
                            girl.y + girl.height > p.y + p.height + this.gap
                        ) {
                            gameOver();
                        }
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Background elements
        const background = {
            draw: function() {
                // Sky
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(100, 80, 20, 0, Math.PI * 2);
                ctx.arc(130, 70, 25, 0, Math.PI * 2);
                ctx.arc(160, 80, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(300, 120, 20, 0, Math.PI * 2);
                ctx.arc(330, 110, 25, 0, Math.PI * 2);
                ctx.arc(360, 120, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // Sun
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(350, 70, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        };
        
        // Game functions
        function startGame() {
            gameRunning = true;
            startScreen.style.display = 'none';
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            girl.reset();
            pipes.reset();
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function resetGame() {
            gameRunning = false;
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            girl.reset();
            pipes.reset();
        }
        
        // Draw everything
        function draw() {
            background.draw();
            pipes.draw();
            ground.draw();
            girl.draw();
        }
        
        // Update game state
        function update() {
            girl.update();
            pipes.update();
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            frames++;
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameRunning) {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameRunning) {
                girl.flap();
            }
        });
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
