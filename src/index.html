<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #start-btn:hover {
            background: #45a049;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the obstacles!</p>
            <p>Press SPACE or click to make her jump</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Obstacles
        let obstacles = [];
        const obstacleWidth = 60;
        const gapHeight = 150;
        const obstacleSpeed = 3;
        
        // Game loop variables
        let animationId;
        let lastObstacleTime = 0;
        const obstacleInterval = 1500; // milliseconds
        
        // Draw girl character
        function drawGirl() {
            // Draw girl body (simple representation)
            ctx.fillStyle = '#FF69B4'; // Pink color
            ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
            
            // Draw girl head
            ctx.fillStyle = '#FFD700'; // Yellow color
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2 - 5, girl.y - 15, 3, 0, Math.PI * 2);
            ctx.arc(girl.x + girl.width/2 + 5, girl.y - 15, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw smile
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 5, 8, 0, Math.PI);
            ctx.stroke();
            
            // Draw dress
            ctx.fillStyle = '#4169E1'; // Blue color
            ctx.fillRect(girl.x, girl.y + girl.height, girl.width, 20);
        }
        
        // Draw obstacles
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                // Top obstacle
                ctx.fillStyle = '#228B22'; // Green color
                ctx.fillRect(obstacle.x, 0, obstacleWidth, obstacle.topHeight);
                
                // Bottom obstacle
                ctx.fillRect(obstacle.x, obstacle.topHeight + gapHeight, obstacleWidth, canvas.height);
                
                // Add some detail to obstacles
                ctx.fillStyle = '#006400'; // Darker green
                ctx.fillRect(obstacle.x, obstacle.topHeight - 10, obstacleWidth, 10);
                ctx.fillRect(obstacle.x, obstacle.topHeight + gapHeight, obstacleWidth, 10);
            });
        }
        
        // Update girl position
        function updateGirl() {
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Floor collision
            if (girl.y + girl.height > canvas.height) {
                girl.y = canvas.height - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        // Create new obstacle
        function createObstacle() {
            const topHeight = Math.floor(Math.random() * (canvas.height - gapHeight - 100)) + 50;
            obstacles.push({
                x: canvas.width,
                topHeight: topHeight,
                passed: false
            });
        }
        
        // Update obstacles
        function updateObstacles() {
            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;
                
                // Remove off-screen obstacles
                if (obstacles[i].x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }
                
                // Check if girl passed the obstacle
                if (!obstacles[i].passed && obstacles[i].x + obstacleWidth < girl.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
                
                // Collision detection
                if (
                    girl.x + girl.width > obstacles[i].x &&
                    girl.x < obstacles[i].x + obstacleWidth &&
                    (girl.y < obstacles[i].topHeight ||
                     girl.y + girl.height > obstacles[i].topHeight + gapHeight)
                ) {
                    gameOver();
                }
            }
        }
        
        // Game loop
        function gameLoop(timestamp) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            // Update and draw game objects
            if (gameRunning) {
                updateGirl();
                updateObstacles();
                
                // Generate new obstacles
                if (timestamp - lastObstacleTime > obstacleInterval) {
                    createObstacle();
                    lastObstacleTime = timestamp;
                }
            }
            
            drawGirl();
            drawObstacles();
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // Draw background elements
        function drawBackground() {
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
            
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(130, 70, 25, 0, Math.PI * 2);
            ctx.arc(160, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(330, 110, 25, 0, Math.PI * 2);
            ctx.arc(360, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            obstacles = [];
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScore.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
            cancelAnimationFrame(animationId);
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameRunning) {
                    girl.velocity = girl.jump;
                } else if (startScreen.style.display !== 'none') {
                    startGame();
                }
            }
        });
        
        canvas.addEventListener('click', () => {
            if (gameRunning) {
                girl.velocity = girl.jump;
            }
        });
        
        restartBtn.addEventListener('click', startGame);
        startBtn.addEventListener('click', startGame);
        
        // Initialize game
        gameLoop(0);
    </script>
</body>
</html>
