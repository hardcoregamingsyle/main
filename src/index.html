<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl character
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            velocity: 0,
            gravity: 0.5,
            jump: -10,
            draw: function() {
                // Draw girl body (simple rectangle for now)
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw girl head
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw girl hair
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y);
                ctx.lineTo(this.x + 15, this.y - 20);
                ctx.lineTo(this.x + 25, this.y - 20);
                ctx.lineTo(this.x + 35, this.y);
                ctx.fill();
                
                // Draw girl eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 5, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 25, this.y - 5, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw girl smile
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 5, 8, 0, Math.PI);
                ctx.stroke();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - groundHeight) {
                    this.y = canvas.height - groundHeight - this.height;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };
        
        // Ground
        const groundHeight = 80;
        
        // Pipes
        const pipes = [];
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Generate new pipes
        function generatePipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - groundHeight - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                bottomHeight: canvas.height - groundHeight - (topHeight + pipeGap),
                passed: false,
                width: pipeWidth,
                speed: pipeSpeed,
                draw: function() {
                    // Draw top pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(this.x, 0, this.width, this.topHeight);
                    
                    // Draw pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                    
                    // Draw bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
                    
                    // Draw pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 20);
                },
                update: function() {
                    this.x -= this.speed;
                },
                isOffScreen: function() {
                    return this.x + this.width < 0;
                },
                collidesWith: function(obj) {
                    return (
                        obj.x < this.x + this.width &&
                        obj.x + obj.width > this.x &&
                        (obj.y < this.topHeight || obj.y + obj.height > this.bottomY)
                    );
                }
            });
        }
        
        // Draw background elements
        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);
            
            // Sun
            ctx.fillStyle = '#FFFF00';
            ctx.beginPath();
            ctx.arc(350, 80, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 100, 30, 0, Math.PI * 2);
            ctx.arc(130, 90, 35, 0, Math.PI * 2);
            ctx.arc(160, 100, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 150, 30, 0, Math.PI * 2);
            ctx.arc(330, 140, 35, 0, Math.PI * 2);
            ctx.arc(360, 150, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
        }
        
        // Update score
        function updateScore() {
            score++;
            scoreDisplay.textContent = 'Score: ' + score;
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes.length = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            if (gameRunning) {
                // Update and draw girl
                girl.update();
                girl.draw();
                
                // Generate new pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                    generatePipe();
                }
                
                // Update and draw pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();
                    pipes[i].draw();
                    
                    // Check if pipe is off screen
                    if (pipes[i].isOffScreen()) {
                        pipes.splice(i, 1);
                    }
                    
                    // Check collision
                    if (pipes[i].collidesWith(girl)) {
                        gameOver();
                    }
                    
                    // Score when passing pipe
                    if (!pipes[i].passed && pipes[i].x + pipes[i].width < girl.x) {
                        pipes[i].passed = true;
                        updateScore();
                    }
                }
            } else {
                // Draw girl at starting position when not running
                girl.draw();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    resetGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                resetGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game loop
        resetGame();
        gameLoop();
    </script>
</body>
</html>
