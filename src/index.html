<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-button:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-button">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 50,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Pipes array
        let pipes = [];
        
        // Pipe properties
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Generate random pipe heights
        function generatePipeHeight() {
            return Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 50;
        }
        
        // Draw girl character
        function drawGirl(x, y, width, height) {
            // Simple girl representation using shapes
            ctx.fillStyle = '#FF69B4'; // Pink dress
            ctx.fillRect(x, y, width, height);
            
            // Head
            ctx.fillStyle = '#FFD700'; // Yellow skin
            ctx.beginPath();
            ctx.arc(x + width/2, y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair
            ctx.fillStyle = '#8B4513'; // Brown hair
            ctx.beginPath();
            ctx.arc(x + width/2, y - 10, 18, 0, Math.PI);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(x + width/2 - 5, y - 12, 2, 0, Math.PI * 2);
            ctx.arc(x + width/2 + 5, y - 12, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.beginPath();
            ctx.arc(x + width/2, y - 5, 5, 0, Math.PI);
            ctx.stroke();
            
            // Arms
            ctx.strokeStyle = '#FF69B4';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x - 5, y + 10);
            ctx.lineTo(x - 15, y + 20);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + width + 5, y + 10);
            ctx.lineTo(x + width + 15, y + 20);
            ctx.stroke();
            
            // Legs
            ctx.beginPath();
            ctx.moveTo(x + 10, y + height);
            ctx.lineTo(x + 10, y + height + 20);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + width - 10, y + height);
            ctx.lineTo(x + width - 10, y + height + 20);
            ctx.stroke();
        }
        
        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillStyle = '#228B22'; // Green pipes
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Pipe cap (top)
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                
                // Bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height);
                
                // Pipe cap (bottom)
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.topHeight + pipeGap, pipeWidth + 10, 20);
            });
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Apply gravity to girl
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move pipes
            pipes.forEach(pipe => {
                pipe.x -= pipeSpeed;
            });
            
            // Remove off-screen pipes
            pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
            
            // Add new pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                const topHeight = generatePipeHeight();
                pipes.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    passed: false
                });
            }
            
            // Check collisions
            checkCollisions();
            
            // Update score
            updateScore();
        }
        
        // Check for collisions
        function checkCollisions() {
            // Ground collision
            if (girl.y + girl.height > canvas.height) {
                gameOver();
                return;
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
            
            // Pipe collisions
            for (let i = 0; i < pipes.length; i++) {
                const pipe = pipes[i];
                
                // Check if girl is within pipe horizontally
                if (girl.x + girl.width > pipe.x && girl.x < pipe.x + pipeWidth) {
                    // Check if girl is above top pipe or below bottom pipe
                    if (girl.y < pipe.topHeight || girl.y + girl.height > pipe.topHeight + pipeGap) {
                        gameOver();
                        return;
                    }
                }
            }
        }
        
        // Update score
        function updateScore() {
            pipes.forEach(pipe => {
                if (!pipe.passed && pipe.x + pipeWidth < girl.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            });
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            // Draw pipes
            drawPipes();
            
            // Draw girl
            drawGirl(girl.x, girl.y, girl.width, girl.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#32CD32'; // Green grass
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
        }
        
        // Draw background elements
        function drawBackground() {
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F7FA');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(120, 70, 25, 0, Math.PI * 2);
            ctx.arc(140, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(320, 110, 25, 0, Math.PI * 2);
            ctx.arc(340, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Restart game
        function restartGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes = [];
            gameOverScreen.style.display = 'none';
        }
        
        // Handle jump
        function jump() {
            if (!gameRunning) {
                restartGame();
                gameRunning = true;
            }
            girl.velocity = girl.jump;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', () => {
            jump();
        });
        
        restartButton.addEventListener('click', restartGame);
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        gameLoop();
    </script>
</body>
</html>
