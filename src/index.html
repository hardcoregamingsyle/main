<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the pipes!</p>
            <p>Press SPACE or click to make her fly upward</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        let frames = 0;
        
        // Load images
        const bgImg = new Image();
        bgImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="%2387CEEB"/></svg>';
        
        const fgImg = new Image();
        fgImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100"><rect width="400" height="100" fill="%238B4513"/></svg>';
        
        // Girl character
        const girl = {
            x: 50,
            y: canvas.height / 2 - 10,
            width: 30,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            
            draw: function() {
                // Draw a simple girl character using SVG-like shapes
                ctx.fillStyle = '#FF69B4'; // Pink dress
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw head
                ctx.fillStyle = '#FFDAB9'; // Skin color
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 10, 10, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw hair
                ctx.fillStyle = '#8B4513'; // Brown hair
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 10, 12, 0, Math.PI);
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 12, this.y - 12, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 18, this.y - 12, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 5, 5, 0, Math.PI);
                ctx.stroke();
            },
            
            update: function() {
                if (gameState === 'playing') {
                    this.velocity += this.gravity;
                    this.y += this.velocity;
                    
                    // Floor collision
                    if (this.y + this.height >= canvas.height - fgImg.height) {
                        this.y = canvas.height - fgImg.height - this.height;
                        if (gameState === 'playing') {
                            gameOver();
                        }
                    }
                    
                    // Ceiling collision
                    if (this.y <= 0) {
                        this.y = 0;
                        this.velocity = 0;
                    }
                }
            },
            
            flap: function() {
                this.velocity = this.jump;
            },
            
            reset: function() {
                this.y = canvas.height / 2 - 10;
                this.velocity = 0;
            }
        };
        
        // Pipes
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22'; // Green pipe
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            
            update: function() {
                if (gameState !== 'playing') return;
                
                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: this.maxYPos * (Math.random() + 1),
                        width: 60,
                        height: 300
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Move pipes to the left
                    p.x -= this.dx;
                    
                    // If pipe goes off screen, remove it
                    if (p.x + p.width <= 0) {
                        this.position.shift();
                        score++;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                    
                    // Collision detection
                    // Top pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y < p.y + p.height
                    ) {
                        gameOver();
                    }
                    
                    // Bottom pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y + girl.height > p.y + p.height + this.gap
                    ) {
                        gameOver();
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Background elements
        const background = {
            draw: function() {
                // Draw sky
                ctx.drawImage(bgImg, 0, 0);
                
                // Draw clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(100, 80, 20, 0, Math.PI * 2);
                ctx.arc(130, 70, 25, 0, Math.PI * 2);
                ctx.arc(160, 80, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(300, 120, 20, 0, Math.PI * 2);
                ctx.arc(330, 110, 25, 0, Math.PI * 2);
                ctx.arc(360, 120, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        };
        
        // Ground
        const ground = {
            draw: function() {
                ctx.drawImage(fgImg, 0, canvas.height - fgImg.height);
                
                // Draw grass details
                ctx.fillStyle = '#32CD32';
                for (let i = 0; i < canvas.width; i += 20) {
                    ctx.fillRect(i, canvas.height - fgImg.height, 10, 5);
                }
            }
        };
        
        // Game functions
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            girl.reset();
            pipes.reset();
        }
        
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function resetGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'playing') {
                    girl.flap();
                } else if (gameState === 'gameover') {
                    resetGame();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameState === 'playing') {
                girl.flap();
            }
        });
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', resetGame);
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            background.draw();
            
            // Draw pipes
            pipes.draw();
            
            // Draw ground
            ground.draw();
            
            // Draw girl
            girl.draw();
            
            // Update game objects
            if (gameState === 'playing') {
                girl.update();
                pipes.update();
            }
            
            frames++;
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
