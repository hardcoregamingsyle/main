<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to jump</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            velocity: 0,
            gravity: 0.5,
            jump: -10,
            draw: function() {
                // Draw a simple girl representation
                ctx.fillStyle = '#FF69B4'; // Pink for girl
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw face
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x + 10, this.y + 10, 8, 8); // Left eye
                ctx.fillRect(this.x + 22, this.y + 10, 8, 8); // Right eye
                
                // Draw mouth
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 25, 5, 0, Math.PI); // Smile
                ctx.stroke();
                
                // Draw hair
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y - 5, this.width, 5);
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - 50) {
                    this.y = canvas.height - 50 - this.height;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };
        
        // Pipes array
        const pipes = [];
        
        // Pipe class
        class Pipe {
            constructor() {
                this.gap = 150;
                this.topHeight = Math.floor(Math.random() * (canvas.height - this.gap - 50));
                this.bottomY = this.topHeight + this.gap;
                this.bottomHeight = canvas.height - this.bottomY;
                this.x = canvas.width;
                this.width = 60;
                this.speed = 3;
                this.passed = false;
            }
            
            update() {
                this.x -= this.speed;
                
                // Check if pipe passed girl
                if (!this.passed && this.x + this.width < girl.x) {
                    this.passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            }
            
            draw() {
                // Draw top pipe
                ctx.fillStyle = '#228B22'; // Green pipe
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                
                // Draw pipe cap
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                
                // Draw bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
                
                // Draw pipe cap
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 20);
            }
            
            isOffScreen() {
                return this.x + this.width < 0;
            }
            
            collidesWith(girl) {
                // Top pipe collision
                if (girl.x + girl.width > this.x &&
                    girl.x < this.x + this.width &&
                    girl.y < this.topHeight) {
                    return true;
                }
                
                // Bottom pipe collision
                if (girl.x + girl.width > this.x &&
                    girl.x < this.x + this.width &&
                    girl.y + girl.height > this.bottomY) {
                    return true;
                }
                
                return false;
            }
        }
        
        // Ground
        const ground = {
            height: 50,
            draw: function() {
                ctx.fillStyle = '#8B4513'; // Brown ground
                ctx.fillRect(0, canvas.height - this.height, canvas.width, this.height);
                
                // Draw grass
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(0, canvas.height - this.height, canvas.width, 10);
            }
        };
        
        // Background elements
        const clouds = [
            {x: 100, y: 50, width: 60, height: 30},
            {x: 300, y: 100, width: 80, height: 40},
            {x: 200, y: 30, width: 70, height: 35}
        ];
        
        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.width/3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/3, cloud.y - 10, cloud.width/4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/2, cloud.y, cloud.width/3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/1.5, cloud.y + 5, cloud.width/4, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Game functions
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes.length = 0;
            
            // Start game loop
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            // Draw ground
            ground.draw();
            
            // Generate pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                pipes.push(new Pipe());
            }
            
            // Update and draw pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].update();
                pipes[i].draw();
                
                // Remove off-screen pipes
                if (pipes[i].isOffScreen()) {
                    pipes.splice(i, 1);
                }
                
                // Check collision
                if (pipes[i].collidesWith(girl)) {
                    gameOver();
                }
            }
            
            // Continue game loop if running
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                startGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', startGame);
        
        // Initial draw
        drawBackground();
        girl.draw();
        ground.draw();
    </script>
</body>
</html>
