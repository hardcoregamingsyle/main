<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-button:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-button">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 50,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Pipes array
        let pipes = [];
        
        // Pipe properties
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Generate random pipe heights
        function generatePipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            return {
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                bottomHeight: canvas.height - (topHeight + pipeGap),
                passed: false
            };
        }
        
        // Draw the girl character
        function drawGirl() {
            // Simple representation of a girl
            ctx.fillStyle = '#FF69B4'; // Pink dress
            ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
            
            // Head
            ctx.fillStyle = '#FFD700'; // Yellow skin
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair
            ctx.fillStyle = '#8B4513'; // Brown hair
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 15, 18, 0, Math.PI);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2 - 5, girl.y - 15, 3, 0, Math.PI * 2);
            ctx.arc(girl.x + girl.width/2 + 5, girl.y - 15, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 5, 5, 0, Math.PI);
            ctx.stroke();
        }
        
        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillStyle = '#228B22'; // Green pipe
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Pipe cap
                ctx.fillStyle = '#006400'; // Darker green
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                
                // Bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, pipe.bottomHeight);
                
                // Pipe cap
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 20);
            });
        }
        
        // Update game state
        function update() {
            // Apply gravity
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move pipes
            pipes.forEach(pipe => {
                pipe.x -= pipeSpeed;
                
                // Check if girl passed the pipe
                if (!pipe.passed && pipe.x + pipeWidth < girl.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            });
            
            // Remove off-screen pipes
            pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
            
            // Add new pipe
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                pipes.push(generatePipe());
            }
            
            // Collision detection
            checkCollisions();
            
            // Ground collision
            if (girl.y + girl.height > canvas.height) {
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        // Check collisions
        function checkCollisions() {
            const girlRect = {
                x: girl.x,
                y: girl.y,
                width: girl.width,
                height: girl.height
            };
            
            for (let i = 0; i < pipes.length; i++) {
                const pipe = pipes[i];
                
                // Top pipe collision
                if (
                    girlRect.x < pipe.x + pipeWidth &&
                    girlRect.x + girlRect.width > pipe.x &&
                    girlRect.y < pipe.topHeight
                ) {
                    gameOver();
                    return;
                }
                
                // Bottom pipe collision
                if (
                    girlRect.x < pipe.x + pipeWidth &&
                    girlRect.x + girlRect.width > pipe.x &&
                    girlRect.y + girlRect.height > pipe.bottomY
                ) {
                    gameOver();
                    return;
                }
            }
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes = [];
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#32CD32'; // Green grass
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
            
            // Draw pipes
            drawPipes();
            
            // Draw girl
            drawGirl();
        }
        
        // Game loop
        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }
        
        // Handle jump
        function jump() {
            if (gameRunning) {
                girl.velocity = girl.jump;
            } else if (!gameRunning && gameOverScreen.style.display === 'flex') {
                resetGame();
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', () => {
            jump();
        });
        
        restartButton.addEventListener('click', resetGame);
        
        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
