<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #start-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .instructions {
            text-align: center;
            max-width: 80%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-button">Play Again</button>
        </div>
        <div id="start-screen">
            <div class="instructions">Help the girl avoid obstacles!<br>Press SPACE or tap to make her fly</div>
            <button id="start-button">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const restartButton = document.getElementById('restart-button');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        let frames = 0;
        
        // Background images
        const bg = new Image();
        bg.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="%2387CEEB"/><circle cx="100" cy="100" r="50" fill="%23FFD700"/><circle cx="300" cy="150" r="40" fill="%23FFD700"/></svg>';
        
        const fg = new Image();
        fg.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100"><rect width="400" height="100" fill="%238B4513"/><rect y="80" width="400" height="20" fill="%23228B22"/></svg>';
        
        // Girl character
        const girl = {
            x: 50,
            y: canvas.height / 2 - 30,
            width: 40,
            height: 50,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            
            draw: function() {
                // Draw girl body
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw girl head
                ctx.fillStyle = '#FFDAB9';
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw girl hair
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y - 10);
                ctx.lineTo(this.x + 10, this.y - 25);
                ctx.lineTo(this.x + 15, this.y - 15);
                ctx.lineTo(this.x + 20, this.y - 30);
                ctx.lineTo(this.x + 25, this.y - 15);
                ctx.lineTo(this.x + 30, this.y - 25);
                ctx.lineTo(this.x + 35, this.y - 10);
                ctx.closePath();
                ctx.fill();
                
                // Draw girl eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 15, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 25, this.y - 15, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw girl smile
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 5, 8, 0, Math.PI);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.stroke();
            },
            
            update: function() {
                if (gameState === 'playing') {
                    this.velocity += this.gravity;
                    this.y += this.velocity;
                    
                    // Floor collision
                    if (this.y + this.height >= canvas.height - fg.height) {
                        this.y = canvas.height - fg.height - this.height;
                        if (gameState === 'playing') {
                            gameOver();
                        }
                    }
                    
                    // Ceiling collision
                    if (this.y <= 0) {
                        this.y = 0;
                        this.velocity = 0;
                    }
                }
            },
            
            flap: function() {
                this.velocity = this.jump;
            },
            
            reset: function() {
                this.y = canvas.height / 2 - 30;
                this.velocity = 0;
            }
        };
        
        // Pipes
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            
            update: function() {
                if (gameState !== 'playing') return;
                
                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: this.maxYPos * (Math.random() + 1),
                        width: 60,
                        height: 300
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Move pipes to the left
                    p.x -= this.dx;
                    
                    // If pipe goes off screen, remove it and add score
                    if (p.x + p.width <= 0) {
                        this.position.shift();
                        score++;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                    
                    // Collision detection
                    // Top pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y < p.y + p.height
                    ) {
                        gameOver();
                    }
                    
                    // Bottom pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y + girl.height > p.y + p.height + this.gap
                    ) {
                        gameOver();
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Draw background
        function drawBackground() {
            ctx.drawImage(bg, 0, 0);
            
            // Draw ground
            ctx.drawImage(fg, 0, canvas.height - fg.height);
        }
        
        // Game functions
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function resetGame() {
            score = 0;
            frames = 0;
            girl.reset();
            pipes.reset();
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
        }
        
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw everything
            drawBackground();
            pipes.draw();
            girl.draw();
            
            // Update game state
            if (gameState === 'playing') {
                girl.update();
                pipes.update();
                frames++;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'playing') {
                    girl.flap();
                } else if (gameState === 'gameover') {
                    resetGame();
                    startGame();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameState === 'playing') {
                girl.flap();
            }
        });
        
        startButton.addEventListener('click', function() {
            startGame();
        });
        
        restartButton.addEventListener('click', function() {
            resetGame();
            startGame();
        });
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
