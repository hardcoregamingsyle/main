<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            radius: 20,
            velocity: 0,
            gravity: 0.5,
            lift: -10,
            draw: function() {
                // Draw girl body
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw hair
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(this.x, this.y - 15, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 8, this.y - 5, 4, 0, Math.PI * 2);
                ctx.arc(this.x + 8, this.y - 5, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw pupils
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x - 8, this.y - 5, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 8, this.y - 5, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y + 5, 8, 0, Math.PI);
                ctx.stroke();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.lift;
            }
        };
        
        // Pipes array
        const pipes = [];
        
        // Pipe class
        class Pipe {
            constructor() {
                this.width = 60;
                this.gap = 150;
                this.x = canvas.width;
                this.topHeight = Math.random() * (canvas.height - this.gap - 100) + 50;
                this.bottomY = this.topHeight + this.gap;
                this.bottomHeight = canvas.height - this.bottomY;
                this.passed = false;
            }
            
            draw() {
                // Top pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                
                // Pipe cap (top)
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x - 5, this.topHeight - 20, this.width + 10, 20);
                
                // Bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
                
                // Pipe cap (bottom)
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 20);
            }
            
            update() {
                this.x -= 3;
                
                // Check if pipe passed girl
                if (!this.passed && this.x + this.width < girl.x) {
                    this.passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            }
            
            isOffScreen() {
                return this.x + this.width < 0;
            }
            
            collidesWith(girl) {
                // Check collision with top pipe
                if (girl.x + girl.radius > this.x &&
                    girl.x - girl.radius < this.x + this.width &&
                    girl.y - girl.radius < this.topHeight) {
                    return true;
                }
                
                // Check collision with bottom pipe
                if (girl.x + girl.radius > this.x &&
                    girl.x - girl.radius < this.x + this.width &&
                    girl.y + girl.radius > this.bottomY) {
                    return true;
                }
                
                return false;
            }
        }
        
        // Create first pipe
        function createPipe() {
            pipes.push(new Pipe());
        }
        
        // Game functions
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
            pipes.length = 0;
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            
            // Create initial pipes
            setTimeout(() => {
                createPipe();
            }, 1000);
            
            gameLoop();
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            // Update and draw pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].update();
                pipes[i].draw();
                
                // Remove off-screen pipes
                if (pipes[i].isOffScreen()) {
                    pipes.splice(i, 1);
                }
                
                // Check collision
                if (pipes[i].collidesWith(girl)) {
                    gameOver();
                    return;
                }
            }
            
            // Generate new pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                createPipe();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function drawBackground() {
            // Draw sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 30, 0, Math.PI * 2);
            ctx.arc(130, 70, 35, 0, Math.PI * 2);
            ctx.arc(160, 80, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 30, 0, Math.PI * 2);
            ctx.arc(330, 110, 35, 0, Math.PI * 2);
            ctx.arc(360, 120, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                startGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', startGame);
        
        // Start the game
        startGame();
    </script>
</body>
</html>
