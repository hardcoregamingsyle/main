<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-btn:hover {
            background: #45a049;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the pipes!</p>
            <p>Press SPACE or CLICK to flap</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let frames = 0;
        
        // Background images
        const bg = new Image();
        bg.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="%2387CEEB"/><circle cx="300" cy="100" r="50" fill="%23FFFFFF" opacity="0.8"/></svg>';
        
        // Ground image
        const ground = new Image();
        ground.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100"><rect width="400" height="100" fill="%238B4513"/><rect y="80" width="400" height="20" fill="%23228B22"/></svg>';
        
        // Girl sprite
        const girl = new Image();
        girl.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="15" r="8" fill="%23FFB6C1"/><path d="M15 23 Q20 30 25 23" stroke="%23FFB6C1" stroke-width="2" fill="none"/><circle cx="17" cy="13" r="1.5" fill="%23000000"/><circle cx="23" cy="13" r="1.5" fill="%23000000"/><path d="M18 25 Q20 27 22 25" stroke="%23FFB6C1" stroke-width="1" fill="none"/><rect x="15" y="25" width="10" height="15" fill="%23FF69B4" rx="3"/></svg>';
        
        // Pipes
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            
            update() {
                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: this.maxYPos * (Math.random() + 1),
                        width: 60,
                        height: 300
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Move pipes to the left
                    p.x -= this.dx;
                    
                    // If pipe goes off screen, remove it and add score
                    if (p.x + p.width <= 0) {
                        this.position.shift();
                        score++;
                        scoreDisplay.textContent = `Score: ${score}`;
                    }
                    
                    // Collision detection
                    // Top pipe
                    if (
                        girlX < p.x + p.width &&
                        girlX + girlWidth > p.x &&
                        girlY < p.y + p.height &&
                        girlY + girlHeight > p.y
                    ) {
                        gameOver();
                    }
                    
                    // Bottom pipe
                    if (
                        girlX < p.x + p.width &&
                        girlX + girlWidth > p.x &&
                        girlY < p.y + p.height + this.gap + 300 &&
                        girlY + girlHeight > p.y + p.height + this.gap
                    ) {
                        gameOver();
                    }
                }
            }
        };
        
        // Girl properties
        const girlWidth = 40;
        const girlHeight = 40;
        let girlX = 50;
        let girlY = canvas.height / 2 - girlHeight / 2;
        let girlVelocity = 0;
        const gravity = 0.5;
        const jump = -10;
        
        // Draw girl
        function drawGirl() {
            ctx.drawImage(girl, girlX, girlY, girlWidth, girlHeight);
        }
        
        // Draw background
        function drawBackground() {
            ctx.drawImage(bg, 0, 0);
        }
        
        // Draw ground
        function drawGround() {
            ctx.drawImage(ground, 0, canvas.height - 100);
        }
        
        // Game functions
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        function resetGame() {
            gameRunning = true;
            score = 0;
            frames = 0;
            girlY = canvas.height / 2 - girlHeight / 2;
            girlVelocity = 0;
            pipes.position = [];
            scoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'none';
        }
        
        // Start game
        function startGame() {
            startScreen.style.display = 'none';
            resetGame();
            gameLoop();
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw everything
            drawBackground();
            pipes.draw();
            drawGirl();
            drawGround();
            
            // Update game state
            girlVelocity += gravity;
            girlY += girlVelocity;
            
            // Update pipes
            pipes.update();
            
            // Ground collision
            if (girlY + girlHeight >= canvas.height - 100) {
                girlY = canvas.height - 100 - girlHeight;
                gameOver();
            }
            
            // Ceiling collision
            if (girlY <= 0) {
                girlY = 0;
                girlVelocity = 0;
            }
            
            frames++;
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameRunning) {
                    girlVelocity = jump;
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameRunning) {
                girlVelocity = jump;
            }
        });
        
        restartBtn.addEventListener('click', resetGame);
        startBtn.addEventListener('click', startGame);
        
        // Initial draw
        drawBackground();
        drawGround();
        drawGirl();
    </script>
</body>
</html>
