<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            overflow: hidden;
            background-color: #fff;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        p {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.5);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        
        <!-- Menu Screen -->
        <div id="menu-screen" class="screen" style="display: flex;">
            <h1>Girl Flapper</h1>
            <p id="high-score-display">High Score: 0</p>
            <button class="button" onclick="document.querySelector('#game-canvas').dispatchEvent(new MouseEvent('click'))">Start Game</button>
            <p class="controls-hint">Press SPACE or CLICK to fly</p>
        </div>
        
        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <h1>Game Over!</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p>High Score: <span id="final-high-score">0</span></p>
            <button class="button" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
