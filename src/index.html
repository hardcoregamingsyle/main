<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-btn:hover {
            background: #45a049;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the pipes!</p>
            <p>Press SPACE or click to make her fly upward.</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Pipes array
        let pipes = [];
        
        // Pipe settings
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Generate random pipe heights
        function generatePipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            return {
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                bottomHeight: canvas.height - (topHeight + pipeGap),
                passed: false
            };
        }
        
        // Draw the girl character
        function drawGirl() {
            // Simple representation of a girl using circles and rectangles
            ctx.fillStyle = '#FF69B4'; // Pink hair
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y + 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Face
            ctx.fillStyle = '#FFDAB9'; // Skin tone
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y + 25, 12, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2 - 4, girl.y + 22, 2, 0, Math.PI * 2);
            ctx.arc(girl.x + girl.width/2 + 4, girl.y + 22, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y + 30, 5, 0, Math.PI);
            ctx.stroke();
            
            // Body
            ctx.fillStyle = '#1E90FF'; // Blue dress
            ctx.fillRect(girl.x, girl.y + 35, girl.width, 30);
            
            // Arms
            ctx.fillStyle = '#FFDAB9';
            ctx.fillRect(girl.x - 5, girl.y + 35, 5, 15);
            ctx.fillRect(girl.x + girl.width, girl.y + 35, 5, 15);
            
            // Legs
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(girl.x + 5, girl.y + 65, 8, 20);
            ctx.fillRect(girl.x + girl.width - 13, girl.y + 65, 8, 20);
        }
        
        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillStyle = '#228B22'; // Green pipes
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Pipe cap (top)
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                
                // Bottom pipe
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, pipe.bottomHeight);
                
                // Pipe cap (bottom)
                ctx.fillStyle = '#006400';
                ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 20);
            });
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Apply gravity to girl
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move pipes
            pipes.forEach(pipe => {
                pipe.x -= pipeSpeed;
                
                // Check if girl passed the pipe
                if (!pipe.passed && pipe.x + pipeWidth < girl.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
            });
            
            // Remove off-screen pipes
            pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
            
            // Add new pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                pipes.push(generatePipe());
            }
            
            // Collision detection
            checkCollision();
            
            // Ground collision
            if (girl.y + girl.height > canvas.height) {
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        // Check collisions
        function checkCollision() {
            const girlRect = {
                x: girl.x,
                y: girl.y,
                width: girl.width,
                height: girl.height
            };
            
            for (let i = 0; i < pipes.length; i++) {
                const pipe = pipes[i];
                
                // Top pipe collision
                const topPipeRect = {
                    x: pipe.x,
                    y: 0,
                    width: pipeWidth,
                    height: pipe.topHeight
                };
                
                // Bottom pipe collision
                const bottomPipeRect = {
                    x: pipe.x,
                    y: pipe.bottomY,
                    width: pipeWidth,
                    height: pipe.bottomHeight
                };
                
                if (isColliding(girlRect, topPipeRect) || isColliding(girlRect, bottomPipeRect)) {
                    gameOver();
                    break;
                }
            }
        }
        
        // Simple rectangle collision detection
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes = [];
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
        }
        
        // Start game
        function startGame() {
            resetGame();
            gameRunning = true;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameLoop();
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            // Update and draw game objects
            update();
            drawPipes();
            drawGirl();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Draw background elements
        function drawBackground() {
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(120, 70, 25, 0, Math.PI * 2);
            ctx.arc(140, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(320, 110, 25, 0, Math.PI * 2);
            ctx.arc(340, 120, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameRunning && !startScreen.style.display) {
                    startGame();
                } else if (gameRunning) {
                    girl.velocity = girl.jump;
                }
            }
        });
        
        canvas.addEventListener('click', () => {
            if (gameRunning) {
                girl.velocity = girl.jump;
            }
        });
        
        startBtn.addEventListener('click', startGame);
        
        restartBtn.addEventListener('click', startGame);
        
        // Initialize game
        window.onload = function() {
            // Draw initial background
            drawBackground();
        };
    </script>
</body>
</html>
