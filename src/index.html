<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Pipes array
        let pipes = [];
        
        // Pipe properties
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Ground properties
        const groundHeight = 80;
        
        // Create a simple girl sprite using canvas
        function drawGirl(x, y, width, height) {
            // Draw girl body
            ctx.fillStyle = '#FF69B4';
            ctx.fillRect(x, y, width, height);
            
            // Draw girl head
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(x + width/2, y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw hair
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x + width/2 - 15, y - 25, 30, 10);
            
            // Draw eyes
            ctx.fillStyle = 'black';
            ctx.fillRect(x + width/2 - 8, y - 15, 4, 4);
            ctx.fillRect(x + width/2 + 4, y - 15, 4, 4);
            
            // Draw smile
            ctx.beginPath();
            ctx.arc(x + width/2, y - 5, 6, 0, Math.PI);
            ctx.stroke();
        }
        
        // Draw pipes
        function drawPipe(pipe) {
            // Draw top pipe
            ctx.fillStyle = '#228B22';
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            
            // Draw pipe cap
            ctx.fillStyle = '#006400';
            ctx.fillRect(pipe.x - 3, pipe.topHeight - 20, pipeWidth + 6, 20);
            
            // Draw bottom pipe
            ctx.fillStyle = '#228B22';
            ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height);
            
            // Draw pipe cap
            ctx.fillStyle = '#006400';
            ctx.fillRect(pipe.x - 3, pipe.topHeight + pipeGap, pipeWidth + 6, 20);
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Apply gravity to girl
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move pipes
            for (let i = 0; i < pipes.length; i++) {
                pipes[i].x -= pipeSpeed;
                
                // Check if pipe passed girl
                if (!pipes[i].passed && pipes[i].x + pipeWidth < girl.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
                
                // Remove pipes that are off screen
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                    i--;
                }
                
                // Collision detection
                if (
                    girl.x + girl.width > pipes[i].x &&
                    girl.x < pipes[i].x + pipeWidth &&
                    (girl.y < pipes[i].topHeight ||
                     girl.y + girl.height > pipes[i].topHeight + pipeGap)
                ) {
                    gameOver();
                }
            }
            
            // Check if girl hits the ground or ceiling
            if (girl.y + girl.height >= canvas.height - groundHeight || girl.y <= 0) {
                gameOver();
            }
            
            // Generate new pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                const topHeight = Math.floor(Math.random() * (canvas.height - groundHeight - pipeGap - 100)) + 50;
                pipes.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    passed: false
                });
            }
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(130, 70, 25, 0, Math.PI * 2);
            ctx.arc(160, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(330, 110, 25, 0, Math.PI * 2);
            ctx.arc(360, 120, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw pipes
            pipes.forEach(drawPipe);
            
            // Draw girl
            drawGirl(girl.x, girl.y, girl.width, girl.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Draw grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes = [];
            gameOverScreen.style.display = 'none';
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Jump function
        function jump() {
            if (gameRunning) {
                girl.velocity = girl.jump;
            } else {
                startGame();
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', jump);
        
        restartBtn.addEventListener('click', startGame);
        
        // Initialize game
        startGame();
        gameLoop();
    </script>
</body>
</html>
