<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <div>Girl Flapper</div>
            <div>Press SPACE or Click to Jump</div>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 60,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Obstacles
        let obstacles = [];
        const obstacleWidth = 60;
        const gap = 150;
        const obstacleSpeed = 3;
        
        // Ground
        const groundHeight = 100;
        
        // Draw girl character
        function drawGirl() {
            // Simple representation of a girl
            ctx.fillStyle = '#FF69B4'; // Pink dress
            ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
            
            // Head
            ctx.fillStyle = '#FFDAB9'; // Skin color
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair
            ctx.fillStyle = '#8B4513'; // Brown hair
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 15, 20, 0, Math.PI);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/3, girl.y - 15, 3, 0, Math.PI * 2);
            ctx.arc(girl.x + 2*girl.width/3, girl.y - 15, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 5, 8, 0, Math.PI);
            ctx.stroke();
        }
        
        // Draw obstacles
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                // Top obstacle
                ctx.fillStyle = '#228B22'; // Green
                ctx.fillRect(obstacle.x, 0, obstacleWidth, obstacle.topHeight);
                
                // Bottom obstacle
                ctx.fillRect(obstacle.x, obstacle.topHeight + gap, obstacleWidth, canvas.height);
            });
        }
        
        // Draw ground
        function drawGround() {
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Grass on top
            ctx.fillStyle = '#32CD32'; // Green grass
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
        }
        
        // Update girl position
        function updateGirl() {
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Floor collision
            if (girl.y + girl.height >= canvas.height - groundHeight) {
                girl.y = canvas.height - groundHeight - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y <= 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        // Update obstacles
        function updateObstacles() {
            // Move obstacles
            obstacles.forEach(obstacle => {
                obstacle.x -= obstacleSpeed;
            });
            
            // Remove off-screen obstacles
            obstacles = obstacles.filter(obstacle => obstacle.x > -obstacleWidth);
            
            // Add new obstacles
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 200) {
                const topHeight = Math.floor(Math.random() * (canvas.height - groundHeight - gap - 100)) + 50;
                obstacles.push({
                    x: canvas.width,
                    topHeight: topHeight
                });
            }
            
            // Check collisions
            checkCollisions();
        }
        
        // Check collisions
        function checkCollisions() {
            const girlRect = {
                x: girl.x,
                y: girl.y,
                width: girl.width,
                height: girl.height
            };
            
            for (let i = 0; i < obstacles.length; i++) {
                const obstacle = obstacles[i];
                
                // Top obstacle collision
                const topRect = {
                    x: obstacle.x,
                    y: 0,
                    width: obstacleWidth,
                    height: obstacle.topHeight
                };
                
                // Bottom obstacle collision
                const bottomRect = {
                    x: obstacle.x,
                    y: obstacle.topHeight + gap,
                    width: obstacleWidth,
                    height: canvas.height
                };
                
                if (isColliding(girlRect, topRect) || isColliding(girlRect, bottomRect)) {
                    gameOver();
                    return;
                }
                
                // Score when passing obstacle
                if (!obstacle.passed && obstacle.x + obstacleWidth < girl.x) {
                    obstacle.passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
            }
        }
        
        // Collision detection helper
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw everything
            drawGround();
            drawObstacles();
            drawGirl();
            
            // Update game objects
            updateGirl();
            updateObstacles();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Reset girl
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            
            // Reset obstacles
            obstacles = [];
            
            gameLoop();
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Jump function
        function jump() {
            if (gameRunning) {
                girl.velocity = girl.jump;
            } else if (!gameRunning && startScreen.style.display !== 'none') {
                startGame();
            }
        }
        
        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', () => {
            jump();
        });
        
        // Initialize
        window.onload = () => {
            drawGround();
            drawGirl();
        };
    </script>
</body>
</html>
