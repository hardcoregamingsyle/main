<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl character properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 60,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Obstacles array
        let obstacles = [];
        
        // Game settings
        const obstacleWidth = 60;
        const obstacleGap = 150;
        const obstacleSpeed = 3;
        
        // Draw girl character
        function drawGirl(x, y, width, height) {
            // Draw girl body
            ctx.fillStyle = '#FF69B4'; // Pink dress
            ctx.fillRect(x, y, width, height);
            
            // Draw girl head
            ctx.fillStyle = '#FFDAB9'; // Skin tone
            ctx.beginPath();
            ctx.arc(x + width/2, y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw hair
            ctx.fillStyle = '#8B4513'; // Brown hair
            ctx.beginPath();
            ctx.arc(x + width/2, y - 10, 18, 0, Math.PI);
            ctx.fill();
            
            // Draw eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(x + width/2 - 5, y - 12, 2, 0, Math.PI * 2);
            ctx.arc(x + width/2 + 5, y - 12, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw smile
            ctx.beginPath();
            ctx.arc(x + width/2, y - 5, 5, 0, Math.PI);
            ctx.stroke();
        }
        
        // Draw obstacle
        function drawObstacle(obstacle) {
            // Top obstacle
            ctx.fillStyle = '#228B22'; // Green obstacle
            ctx.fillRect(obstacle.x, 0, obstacle.width, obstacle.topHeight);
            
            // Bottom obstacle
            ctx.fillRect(obstacle.x, obstacle.topHeight + obstacleGap, obstacle.width, canvas.height);
            
            // Add some details to obstacles
            ctx.fillStyle = '#006400'; // Darker green
            ctx.fillRect(obstacle.x, 0, obstacle.width, 20);
            ctx.fillRect(obstacle.x, obstacle.topHeight + obstacleGap, obstacle.width, 20);
        }
        
        // Generate new obstacle
        function generateObstacle() {
            const topHeight = Math.floor(Math.random() * (canvas.height - obstacleGap - 100)) + 50;
            
            obstacles.push({
                x: canvas.width,
                width: obstacleWidth,
                topHeight: topHeight,
                passed: false
            });
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Apply gravity to girl
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move obstacles
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= obstacleSpeed;
                
                // Check if girl passed obstacle
                if (!obstacles[i].passed && obstacles[i].x + obstacles[i].width < girl.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
                
                // Remove obstacles that are off screen
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
                
                // Collision detection
                if (
                    girl.x + girl.width > obstacles[i].x &&
                    girl.x < obstacles[i].x + obstacles[i].width &&
                    (girl.y < obstacles[i].topHeight || 
                     girl.y + girl.height > obstacles[i].topHeight + obstacleGap)
                ) {
                    gameOver();
                }
            }
            
            // Ground collision
            if (girl.y + girl.height > canvas.height) {
                girl.y = canvas.height - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
            
            // Generate new obstacles
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 200) {
                generateObstacle();
            }
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            // Draw obstacles
            obstacles.forEach(drawObstacle);
            
            // Draw girl
            drawGirl(girl.x, girl.y, girl.width, girl.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
        }
        
        // Draw background elements
        function drawBackground() {
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F7FA');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(130, 70, 25, 0, Math.PI * 2);
            ctx.arc(160, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(330, 110, 25, 0, Math.PI * 2);
            ctx.arc(360, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.x = 80;
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            obstacles = [];
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        // Handle jump
        function jump() {
            if (!gameRunning) {
                resetGame();
                return;
            }
            
            girl.velocity = girl.jump;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', () => {
            jump();
        });
        
        restartBtn.addEventListener('click', () => {
            resetGame();
        });
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
