<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #FF6B6B;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #restart-btn:hover {
            background: #FF5252;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4ECDC4;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #start-btn:hover {
            background: #26A69A;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the pipes!
            Press SPACE or CLICK to flap and avoid obstacles.</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        let frames = 0;
        
        // Load images
        const bgImg = new Image();
        bgImg.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjYwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjYwMCIgZmlsbD0iIzg3Q0VFQiIvPjwvc3ZnPg==';
        
        const girlImg = new Image();
        girlImg.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjUwIiBoZWlnaHQ9IjUwIiBmaWxsPSIjRkZGRkZGIi8+PHBhdGggZD0iTTI1IDI1IEE5IDkgMCAwIDEgMzUgMzUgQzI1IDQwIDIwIDM1IDI1IDI1WiIgZmlsbD0iI0ZGRkZGRiIvPjxjaXJjbGUgY3g9IjIwIiBjeT0iMjAiIHI9IjMiIGZpbGw9IiMwMDAiLz48Y2lyY2xlIGN4PSIzNSIgY3k9IjIwIiByPSIzIiBmaWxsPSIjMDAwIi8+PHBhdGggZD0iTTIwIDM1IEE1IDUgMCAwIDEgMzAgMzUiIHN0cm9rZT0iIzAwMCIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+';
        
        const pipeTopImg = new Image();
        pipeTopImg.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iMTgwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSI2MCIgaGVpZ2h0PSIxODAiIGZpbGw9IiMzQkYwMzkiLz48cmVjdCB3aWR0aD0iNjAiIGhlaWdodD0iMjAiIGZpbGw9IiMwMDdGNjYiLz48L3N2Zz4=';
        
        const pipeBottomImg = new Image();
        pipeBottomImg.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iMTgwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSI2MCIgaGVpZ2h0PSIxODAiIGZpbGw9IiMzQkYwMzkiLz48cmVjdCB3aWR0aD0iNjAiIGhlaWdodD0iMjAiIGZpbGw9IiMwMDdGNjYiLz48L3N2Zz4=';
        
        // Background object
        const background = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: canvas.height,
            draw: function() {
                ctx.drawImage(bgImg, this.x, this.y, this.width, this.height);
            }
        };
        
        // Girl object
        const girl = {
            x: 50,
            y: canvas.height / 2 - 10,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            draw: function() {
                ctx.drawImage(girlImg, this.x, this.y, this.width, this.height);
            },
            update: function() {
                if (gameState === 'playing') {
                    this.velocity += this.gravity;
                    this.y += this.velocity;
                    
                    // Floor collision
                    if (this.y + this.height >= canvas.height - ground.height) {
                        this.y = canvas.height - ground.height - this.height;
                        if (gameState === 'playing') {
                            gameOver();
                        }
                    }
                    
                    // Ceiling collision
                    if (this.y <= 0) {
                        this.y = 0;
                        this.velocity = 0;
                    }
                }
            },
            flap: function() {
                this.velocity = this.jump;
            },
            reset: function() {
                this.y = canvas.height / 2 - 10;
                this.velocity = 0;
            }
        };
        
        // Ground object
        const ground = {
            x: 0,
            y: canvas.height - 20,
            width: canvas.width,
            height: 20,
            draw: function() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw grass
                ctx.fillStyle = '#228B22';
                ctx.fillRect(this.x, this.y, this.width, 5);
            }
        };
        
        // Pipes array
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.drawImage(pipeTopImg, p.x, p.y, p.width, p.height);
                    
                    // Bottom pipe
                    ctx.drawImage(pipeBottomImg, p.x, p.y + p.height + this.gap, p.width, p.height);
                }
            },
            
            update: function() {
                if (gameState !== 'playing') return;
                
                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: this.maxYPos * (Math.random() + 1),
                        width: 60,
                        height: 180
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Move pipes to the left
                    p.x -= this.dx;
                    
                    // If pipe goes off screen, remove it and add score
                    if (p.x + p.width <= 0) {
                        this.position.shift();
                        score++;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                    
                    // Collision detection
                    // Top pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y < p.y + p.height
                    ) {
                        gameOver();
                    }
                    
                    // Bottom pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y + girl.height > p.y + p.height + this.gap
                    ) {
                        gameOver();
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Draw score
        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText('Score: ' + score, 20, 30);
        }
        
        // Game over function
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            score = 0;
            frames = 0;
            girl.reset();
            pipes.reset();
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
            gameState = 'playing';
        }
        
        // Start game
        function startGame() {
            startScreen.style.display = 'none';
            gameState = 'playing';
        }
        
        // Handle keyboard input
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'playing') {
                    girl.flap();
                } else if (gameState === 'gameover') {
                    resetGame();
                }
            }
        });
        
        // Handle mouse click
        canvas.addEventListener('click', function() {
            if (gameState === 'playing') {
                girl.flap();
            } else if (gameState === 'gameover') {
                resetGame();
            }
        });
        
        // Handle start button
        startBtn.addEventListener('click', startGame);
        
        // Handle restart button
        restartBtn.addEventListener('click', resetGame);
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            background.draw();
            
            // Update and draw pipes
            pipes.update();
            pipes.draw();
            
            // Draw ground
            ground.draw();
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            // Draw score
            drawScore();
            
            frames++;
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
