<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Your score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Avoid the pipes and help the girl fly through the obstacles!</p>
            <p>Press SPACE or click to make the girl flap her wings</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            velocity: 0,
            gravity: 0.5,
            jump: -10,
            draw: function() {
                // Draw a simple girl character
                ctx.fillStyle = '#FF69B4'; // Pink hair
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw face
                ctx.fillStyle = '#FFDAB9'; // Skin tone
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 20, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y + 18, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 25, this.y + 18, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 25, 5, 0, Math.PI);
                ctx.stroke();
                
                // Draw dress
                ctx.fillStyle = '#4169E1'; // Blue dress
                ctx.fillRect(this.x, this.y + 30, this.width, 30);
                
                // Draw arms
                ctx.fillStyle = '#FFDAB9';
                ctx.fillRect(this.x - 5, this.y + 20, 5, 15);
                ctx.fillRect(this.x + 40, this.y + 20, 5, 15);
                
                // Draw legs
                ctx.fillRect(this.x + 5, this.y + 60, 10, 20);
                ctx.fillRect(this.x + 25, this.y + 60, 10, 20);
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - groundHeight) {
                    this.y = canvas.height - groundHeight - this.height;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };
        
        // Ground properties
        const groundHeight = 80;
        
        // Pipes array
        const pipes = [];
        
        // Pipe properties
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Generate new pipes
        function generatePipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - groundHeight - pipeGap - minHeight;
            const pipeHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            pipes.push({
                x: canvas.width,
                y: 0,
                width: pipeWidth,
                height: pipeHeight,
                passed: false,
                draw: function() {
                    // Draw top pipe
                    ctx.fillStyle = '#228B22'; // Green pipe
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // Draw pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(this.x - 5, this.height - 20, this.width + 10, 20);
                    
                    // Draw bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(this.x, this.height + pipeGap, this.width, canvas.height - groundHeight - (this.height + pipeGap));
                    
                    // Draw pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(this.x - 5, this.height + pipeGap, this.width + 10, 20);
                },
                update: function() {
                    this.x -= pipeSpeed;
                },
                isOffScreen: function() {
                    return this.x + this.width < 0;
                },
                collidesWith: function(obj) {
                    return (
                        obj.x < this.x + this.width &&
                        obj.x + obj.width > this.x &&
                        (obj.y < this.height ||
                         obj.y + obj.height > this.height + pipeGap)
                    );
                }
            });
        }
        
        // Draw ground
        function drawGround() {
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Draw grass
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
        }
        
        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            // Cloud 1
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(130, 70, 25, 0, Math.PI * 2);
            ctx.arc(160, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Cloud 2
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(330, 110, 25, 0, Math.PI * 2);
            ctx.arc(360, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Update score
        function updateScore() {
            for (let i = 0; i < pipes.length; i++) {
                if (!pipes[i].passed && pipes[i].x + pipes[i].width < girl.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScore.textContent = 'Your score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes.length = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            resetGame();
            gameLoop();
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawClouds();
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            // Generate pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                generatePipe();
            }
            
            // Update and draw pipes
            for (let i = 0; i < pipes.length; i++) {
                pipes[i].update();
                pipes[i].draw();
                
                // Check collisions
                if (pipes[i].collidesWith(girl)) {
                    gameOver();
                    return;
                }
                
                // Remove off-screen pipes
                if (pipes[i].isOffScreen()) {
                    pipes.splice(i, 1);
                    i--;
                }
            }
            
            // Update score
            updateScore();
            
            // Draw ground
            drawGround();
            
            // Continue game loop
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameRunning) {
                    girl.flap();
                } else if (startScreen.style.display !== 'none') {
                    startGame();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameRunning) {
                girl.flap();
            }
        });
        
        startBtn.addEventListener('click', startGame);
        
        restartBtn.addEventListener('click', function() {
            startGame();
        });
        
        // Initial draw
        function init() {
            // Draw initial scene
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawClouds();
            drawGround();
            girl.draw();
        }
        
        init();
    </script>
</body>
</html>
