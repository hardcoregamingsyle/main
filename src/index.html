<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .instructions {
            margin-bottom: 20px;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <div class="instructions">Help the girl navigate through the obstacles!</div>
            <div class="instructions">Press SPACE or CLICK to make her jump</div>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Obstacles array
        let obstacles = [];
        
        // Game settings
        const obstacleWidth = 60;
        const gapHeight = 150;
        const obstacleSpeed = 3;
        
        // Draw girl (simple representation)
        function drawGirl() {
            ctx.fillStyle = '#FF69B4'; // Pink color for the girl
            ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
            
            // Draw face
            ctx.fillStyle = 'white';
            ctx.fillRect(girl.x + 10, girl.y + 10, 8, 8); // Left eye
            ctx.fillRect(girl.x + 22, girl.y + 10, 8, 8); // Right eye
            
            // Draw smile
            ctx.beginPath();
            ctx.arc(girl.x + 20, girl.y + 25, 8, 0, Math.PI); // Smile arc
            ctx.stroke();
            
            // Draw hair
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(girl.x - 5, girl.y, 5, 15); // Left hair strand
            ctx.fillRect(girl.x + 35, girl.y, 5, 15); // Right hair strand
        }
        
        // Draw obstacle
        function drawObstacle(obstacle) {
            // Top pipe
            ctx.fillStyle = '#228B22'; // Green color
            ctx.fillRect(obstacle.x, 0, obstacleWidth, obstacle.topHeight);
            
            // Bottom pipe
            ctx.fillRect(obstacle.x, obstacle.topHeight + gapHeight, obstacleWidth, canvas.height);
            
            // Pipe caps
            ctx.fillStyle = '#006400'; // Darker green
            ctx.fillRect(obstacle.x - 5, obstacle.topHeight - 20, obstacleWidth + 10, 20);
            ctx.fillRect(obstacle.x - 5, obstacle.topHeight + gapHeight, obstacleWidth + 10, 20);
        }
        
        // Generate new obstacle
        function generateObstacle() {
            const topHeight = Math.floor(Math.random() * (canvas.height - gapHeight - 100)) + 50;
            obstacles.push({
                x: canvas.width,
                topHeight: topHeight,
                passed: false
            });
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Apply gravity to girl
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;
                
                // Check if girl passed the obstacle
                if (!obstacles[i].passed && obstacles[i].x + obstacleWidth < girl.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
                
                // Remove obstacles that are off screen
                if (obstacles[i].x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                }
            }
            
            // Generate new obstacles
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 200) {
                generateObstacle();
            }
            
            // Check collisions
            checkCollisions();
            
            // Check if girl hits ground or ceiling
            if (girl.y + girl.height > canvas.height || girl.y < 0) {
                gameOver();
            }
        }
        
        // Check collisions
        function checkCollisions() {
            for (let obstacle of obstacles) {
                // Check if girl collides with top or bottom pipe
                if (
                    girl.x + girl.width > obstacle.x &&
                    girl.x < obstacle.x + obstacleWidth &&
                    (girl.y < obstacle.topHeight ||
                     girl.y + girl.height > obstacle.topHeight + gapHeight)
                ) {
                    gameOver();
                    break;
                }
            }
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            drawBackground();
            
            // Draw obstacles
            obstacles.forEach(drawObstacle);
            
            // Draw girl
            drawGirl();
        }
        
        // Draw background elements
        function drawBackground() {
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw some clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(130, 70, 25, 0, Math.PI * 2);
            ctx.arc(160, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(330, 110, 25, 0, Math.PI * 2);
            ctx.arc(360, 120, 20, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            obstacles = [];
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Jump function
        function jump() {
            if (gameRunning) {
                girl.velocity = girl.jump;
            } else if (!gameRunning && startScreen.style.display !== 'none') {
                startGame();
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', jump);
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // Initialize game
        gameLoop();
    </script>
</body>
</html>
