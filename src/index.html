<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #FF6B6B;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #FF5252;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl character
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            draw: function() {
                // Draw a simple girl character
                ctx.fillStyle = '#FF69B4';
                // Head
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Body
                ctx.fillStyle = '#4169E1';
                ctx.fillRect(this.x, this.y + 25, this.width, 25);
                
                // Dress
                ctx.fillStyle = '#FF1493';
                ctx.fillRect(this.x, this.y + 25, this.width, 15);
                
                // Hair
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y + 10);
                ctx.lineTo(this.x + 15, this.y - 5);
                ctx.lineTo(this.x + 25, this.y + 10);
                ctx.closePath();
                ctx.fill();
                
                // Arms
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(this.x - 5, this.y + 30, 5, 15);
                ctx.fillRect(this.x + 40, this.y + 30, 5, 15);
                
                // Legs
                ctx.fillStyle = '#4169E1';
                ctx.fillRect(this.x + 10, this.y + 50, 8, 20);
                ctx.fillRect(this.x + 22, this.y + 50, 8, 20);
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height >= canvas.height - 50) {
                    this.y = canvas.height - 50 - this.height;
                    if (gameRunning) {
                        gameOver();
                    }
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };
        
        // Pipes
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            update: function() {
                if (gameRunning) {
                    // Add new pipe
                    if (frames % 100 === 0) {
                        this.position.push({
                            x: canvas.width,
                            y: this.maxYPos * (Math.random() + 1),
                            width: 60,
                            height: 300
                        });
                    }
                    
                    // Move pipes and remove off-screen pipes
                    for (let i = 0; i < this.position.length; i++) {
                        let p = this.position[i];
                        
                        p.x -= this.dx;
                        
                        // If pipe moves off screen, remove it and add score
                        if (p.x + p.width <= 0) {
                            this.position.shift();
                            score++;
                            scoreDisplay.textContent = 'Score: ' + score;
                        }
                        
                        // Collision detection
                        if (
                            girl.x + girl.width > p.x &&
                            girl.x < p.x + p.width &&
                            (girl.y < p.y + p.height ||
                             girl.y + girl.height > p.y + p.height + this.gap)
                        ) {
                            gameOver();
                        }
                    }
                }
            }
        };
        
        // Background elements
        const background = {
            draw: function() {
                // Sky
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Ground
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
                
                // Grass
                ctx.fillStyle = '#228B22';
                ctx.fillRect(0, canvas.height - 50, canvas.width, 10);
                
                // Clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(100, 80, 20, 0, Math.PI * 2);
                ctx.arc(130, 70, 25, 0, Math.PI * 2);
                ctx.arc(160, 80, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(300, 120, 20, 0, Math.PI * 2);
                ctx.arc(330, 110, 25, 0, Math.PI * 2);
                ctx.arc(360, 120, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        };
        
        // Game functions
        let frames = 0;
        
        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            pipes.position = [];
        }
        
        function gameOver() {
            gameRunning = false;
            finalScore.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function draw() {
            background.draw();
            pipes.draw();
            girl.draw();
        }
        
        function update() {
            girl.update();
            pipes.update();
        }
        
        function gameLoop() {
            update();
            draw();
            frames++;
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                startGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', startGame);
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
