<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="instructions">Press SPACE or CLICK to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let frames = 0;
        
        // Girl character properties
        const girl = {
            x: 50,
            y: canvas.height / 2 - 10,
            width: 30,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            
            draw: function() {
                // Draw girl body
                ctx.fillStyle = '#FF69B4'; // Pink dress
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw girl head
                ctx.fillStyle = '#FFD700'; // Yellow skin
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw hair
                ctx.fillStyle = '#8B4513'; // Brown hair
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y - 15);
                ctx.lineTo(this.x + 25, this.y - 15);
                ctx.lineTo(this.x + 20, this.y - 5);
                ctx.lineTo(this.x + 10, this.y - 5);
                ctx.closePath();
                ctx.fill();
                
                // Draw eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 10, this.y - 12, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 20, this.y - 12, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 5, 5, 0, Math.PI);
                ctx.stroke();
            },
            
            update: function() {
                if (this.y + this.height >= canvas.height - groundHeight) {
                    this.y = canvas.height - groundHeight - this.height;
                    if (gameRunning) {
                        gameOver();
                    }
                }
                
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
                
                this.velocity += this.gravity;
                this.y += this.velocity;
            },
            
            flap: function() {
                this.velocity = this.jump;
            },
            
            reset: function() {
                this.y = canvas.height / 2 - 10;
                this.velocity = 0;
            }
        };
        
        // Ground properties
        const groundHeight = 80;
        
        // Pipes array
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22'; // Green pipe
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400'; // Darker green cap
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            
            update: function() {
                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: this.maxYPos * (Math.random() + 1),
                        width: 60,
                        height: 300
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Move pipe to the left
                    p.x -= this.dx;
                    
                    // If pipe moves off screen, remove it and add score
                    if (p.x + p.width <= 0) {
                        this.position.shift();
                        score++;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                    
                    // Collision detection
                    // Top pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y < p.y + p.height
                    ) {
                        gameOver();
                    }
                    
                    // Bottom pipe
                    if (
                        girl.x + girl.width > p.x &&
                        girl.x < p.x + p.width &&
                        girl.y + girl.height > p.y + p.height + this.gap
                    ) {
                        gameOver();
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Background elements
        function drawBackground() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#E0F7FA');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 80, 30, 0, Math.PI * 2);
            ctx.arc(130, 70, 35, 0, Math.PI * 2);
            ctx.arc(160, 80, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 30, 0, Math.PI * 2);
            ctx.arc(330, 110, 35, 0, Math.PI * 2);
            ctx.arc(360, 120, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Ground
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Grass
            ctx.fillStyle = '#228B22'; // Green grass
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
        }
        
        // Game functions
        function startGame() {
            gameRunning = true;
            score = 0;
            frames = 0;
            girl.reset();
            pipes.reset();
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            // Update and draw pipes
            pipes.update();
            pipes.draw();
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            // Increment frames
            frames++;
            
            // Continue game loop
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                startGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', startGame);
        
        // Start the game loop
        gameLoop();
        
        // Initial start
        startGame();
    </script>
</body>
</html>
