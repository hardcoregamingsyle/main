<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h2>Girl Flapper</h2>
            <p>Press SPACE or click to make the girl flap</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Obstacles
        let obstacles = [];
        const obstacleWidth = 60;
        const obstacleGap = 150;
        const obstacleSpeed = 3;
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function update() {
            if (gameState !== 'playing') return;
            
            // Apply gravity to girl
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Move obstacles
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= obstacleSpeed;
                
                // Check if obstacle passed girl (for scoring)
                if (obstacles[i].x + obstacleWidth < girl.x && !obstacles[i].passed) {
                    obstacles[i].passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
                
                // Remove obstacles that are off screen
                if (obstacles[i].x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
                
                // Collision detection
                if (
                    girl.x < obstacles[i].x + obstacleWidth &&
                    girl.x + girl.width > obstacles[i].x &&
                    (girl.y < obstacles[i].topHeight || 
                     girl.y + girl.height > obstacles[i].topHeight + obstacleGap)
                ) {
                    gameOver();
                }
            }
            
            // Ground collision
            if (girl.y + girl.height > canvas.height) {
                girl.y = canvas.height - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
            
            // Generate new obstacles
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 200) {
                generateObstacle();
            }
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sky background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Draw grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
            
            // Draw girl (simplified representation)
            ctx.fillStyle = '#FF69B4'; // Pink color for girl
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y + girl.height/2, girl.width/2, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw girl face
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2 - 8, girl.y + girl.height/2 - 5, 3, 0, Math.PI * 2);
            ctx.arc(girl.x + girl.width/2 + 8, girl.y + girl.height/2 - 5, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw smile
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y + girl.height/2 + 5, 8, 0, Math.PI);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Draw girl dress
            ctx.fillStyle = '#FFB6C1';
            ctx.fillRect(girl.x, girl.y + girl.height/2, girl.width, girl.height/2);
            
            // Draw obstacles
            ctx.fillStyle = '#228B22';
            for (let obstacle of obstacles) {
                // Top obstacle
                ctx.fillRect(obstacle.x, 0, obstacleWidth, obstacle.topHeight);
                
                // Bottom obstacle
                ctx.fillRect(
                    obstacle.x, 
                    obstacle.topHeight + obstacleGap, 
                    obstacleWidth, 
                    canvas.height - obstacle.topHeight - obstacleGap
                );
            }
        }
        
        // Generate new obstacle
        function generateObstacle() {
            const minHeight = 50;
            const maxHeight = canvas.height - obstacleGap - 50;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            obstacles.push({
                x: canvas.width,
                topHeight: topHeight,
                passed: false
            });
        }
        
        // Jump function
        function jump() {
            if (gameState === 'playing') {
                girl.velocity = girl.jump;
            } else if (gameState === 'start') {
                startGame();
            }
        }
        
        // Start game
        function startGame() {
            gameState = 'playing';
            startScreen.style.display = 'none';
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            obstacles = [];
        }
        
        // Game over
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                jump();
            }
        });
        
        canvas.addEventListener('click', jump);
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // Initialize game
        gameLoop();
    </script>
</body>
</html>
