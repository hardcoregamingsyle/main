<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-btn:hover {
            background: #45a049;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
        <div id="start-screen">
            <h1>Girl Flapper</h1>
            <p>Help the girl navigate through the obstacles!</p>
            <p>Press SPACE or click to make her jump</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            velocity: 0,
            gravity: 0.5,
            jump: -10,
            draw: function() {
                // Draw a simple girl representation
                ctx.fillStyle = '#FF69B4'; // Pink color for girl
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw face
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x + 10, this.y + 10, 8, 8); // Left eye
                ctx.fillRect(this.x + 22, this.y + 10, 8, 8); // Right eye
                
                // Draw smile
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 25, 8, 0, Math.PI); // Smile
                ctx.stroke();
                
                // Draw hair
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x - 5, this.y, 50, 10);
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height > canvas.height - groundHeight) {
                    this.y = canvas.height - groundHeight - this.height;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y < 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };
        
        // Ground properties
        const groundHeight = 80;
        
        // Obstacles
        let obstacles = [];
        const obstacleWidth = 60;
        const gap = 150;
        const obstacleSpeed = 3;
        
        // Generate new obstacle
        function generateObstacle() {
            const minHeight = 50;
            const maxHeight = canvas.height - groundHeight - gap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);
            
            obstacles.push({
                x: canvas.width,
                y: 0,
                width: obstacleWidth,
                height: topHeight,
                passed: false,
                draw: function() {
                    // Top obstacle
                    ctx.fillStyle = '#228B22'; // Green color
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // Bottom obstacle
                    const bottomY = this.height + gap;
                    const bottomHeight = canvas.height - groundHeight - bottomY;
                    ctx.fillRect(this.x, bottomY, this.width, bottomHeight);
                },
                update: function() {
                    this.x -= obstacleSpeed;
                }
            });
        }
        
        // Collision detection
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }
        
        // Update score
        function updateScore() {
            for (let i = 0; i < obstacles.length; i++) {
                if (!obstacles[i].passed && obstacles[i].x + obstacleWidth < girl.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Reset game
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            obstacles = [];
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
        }
        
        // Start game
        function startGame() {
            resetGame();
            gameRunning = true;
            startScreen.style.display = 'none';
            gameLoop();
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Draw grass on top of ground
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            // Generate obstacles
            if (Math.random() < 0.02) { // Chance to generate new obstacle
                generateObstacle();
            }
            
            // Update and draw obstacles
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update();
                obstacles[i].draw();
                
                // Check collision
                if (checkCollision(girl, obstacles[i])) {
                    gameOver();
                    return;
                }
                
                // Remove obstacles that are off screen
                if (obstacles[i].x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }
            
            // Update score
            updateScore();
            
            // Continue game loop
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameRunning) {
                    girl.flap();
                } else if (startScreen.style.display !== 'none') {
                    startGame();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameRunning) {
                girl.flap();
            }
        });
        
        startBtn.addEventListener('click', startGame);
        
        restartBtn.addEventListener('click', function() {
            startGame();
        });
        
        // Initial draw
        function init() {
            // Draw initial scene
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
            
            // Draw initial girl
            girl.draw();
        }
        
        init();
    </script>
</body>
</html>
