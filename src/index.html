<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girl Flapper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Arial', sans-serif; overflow: hidden; }
    #game-container { position: relative; width: 400px; height: 600px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); border-radius: 10px; }
    canvas { display: block; }
    #start-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; z-index: 1000; text-align: center; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="600"></canvas>
  <button id="start-button">Start Game</button>
  <script src="src/game.js"></script>
</body>
</html>
