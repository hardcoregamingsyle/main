<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or tap to flap</div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let frames = 0;
        
        // Background images
        const bgImg = new Image();
        bgImg.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="%2387CEEB"/><circle cx="300" cy="100" r="50" fill="%23FFD700"/><rect x="100" y="400" width="200" height="200" fill="%23228B22"/></svg>';
        
        const fgImg = new Image();
        fgImg.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="%23228B22"/></svg>';
        
        // Girl character
        const girl = {
            x: 50,
            y: canvas.height / 2 - 30,
            width: 40,
            height: 60,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            
            draw: function() {
                // Draw girl body
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw girl head
                ctx.fillStyle = '#FFDAB9';
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 10, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw hair
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y - 15);
                ctx.lineTo(this.x + 15, this.y - 25);
                ctx.lineTo(this.x + 25, this.y - 20);
                ctx.lineTo(this.x + 35, this.y - 15);
                ctx.stroke();
                
                // Draw eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y - 12, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 25, this.y - 12, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smile
                ctx.strokeStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - 5, 5, 0, Math.PI);
                ctx.stroke();
                
                // Draw dress
                ctx.fillStyle = '#4169E1';
                ctx.fillRect(this.x, this.y + 40, this.width, 20);
            },
            
            update: function() {
                if (gameRunning) {
                    this.velocity += this.gravity;
                    this.y += this.velocity;
                    
                    // Floor collision
                    if (this.y + this.height >= canvas.height - fgImg.height) {
                        this.y = canvas.height - fgImg.height - this.height;
                        gameOver();
                    }
                    
                    // Ceiling collision
                    if (this.y <= 0) {
                        this.y = 0;
                        this.velocity = 0;
                    }
                }
            },
            
            flap: function() {
                this.velocity = this.jump;
            },
            
            reset: function() {
                this.y = canvas.height / 2 - 30;
                this.velocity = 0;
            }
        };
        
        // Pipes
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height - 20, p.width + 10, 20);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(p.x, p.y + p.height + this.gap, p.width, canvas.height);
                    
                    // Pipe cap
                    ctx.fillStyle = '#006400';
                    ctx.fillRect(p.x - 5, p.y + p.height + this.gap, p.width + 10, 20);
                }
            },
            
            update: function() {
                if (gameRunning) {
                    if (frames % 100 === 0) {
                        this.position.push({
                            x: canvas.width,
                            y: this.maxYPos * (Math.random() + 1),
                            width: 60,
                            height: 300
                        });
                    }
                    
                    for (let i = 0; i < this.position.length; i++) {
                        let p = this.position[i];
                        
                        // Move pipes to the left
                        p.x -= this.dx;
                        
                        // If pipe moves off screen, remove it
                        if (p.x + p.width <= 0) {
                            this.position.shift();
                            score++;
                            scoreDisplay.textContent = 'Score: ' + score;
                        }
                        
                        // Collision detection
                        // Top pipe
                        if (
                            girl.x + girl.width > p.x &&
                            girl.x < p.x + p.width &&
                            girl.y < p.y + p.height
                        ) {
                            gameOver();
                        }
                        
                        // Bottom pipe
                        if (
                            girl.x + girl.width > p.x &&
                            girl.x < p.x + p.width &&
                            girl.y + girl.height > p.y + p.height + this.gap
                        ) {
                            gameOver();
                        }
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Draw background
        function drawBackground() {
            ctx.drawImage(bgImg, 0, 0);
            ctx.drawImage(fgImg, 0, canvas.height - fgImg.height);
        }
        
        // Game functions
        function startGame() {
            gameRunning = true;
            score = 0;
            frames = 0;
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
            girl.reset();
            pipes.reset();
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            // Update and draw pipes
            pipes.update();
            pipes.draw();
            
            // Update and draw girl
            girl.update();
            girl.draw();
            
            frames++;
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    girl.flap();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (!gameRunning) {
                startGame();
            } else {
                girl.flap();
            }
        });
        
        restartBtn.addEventListener('click', startGame);
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
