<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #instructions {
            margin-top: 20px;
            font-size: 16px;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
        
        <div id="start-screen">
            <h2>Girl Flapper</h2>
            <p>Help the girl fly through the pipes!</p>
            <button id="start-btn">Start Game</button>
            <div id="instructions">
                <p>Press SPACE or CLICK to make the girl flap her wings</p>
                <p>Avoid the pipes and don't hit the ground!</p>
            </div>
        </div>
    </div>
    
    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        let frames = 0;
        
        // Load images
        const bgImg = new Image();
        bgImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="400" height="600" fill="%2387CEEB"/><circle cx="300" cy="100" r="50" fill="%23FFFFFF" opacity="0.8"/></svg>';
        
        const girlImg = new Image();
        girlImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="15" r="8" fill="%23FFB6C1"/><path d="M15 20 Q20 25 25 20" stroke="%23000000" stroke-width="2" fill="none"/><circle cx="17" cy="13" r="2" fill="%23000000"/><circle cx="23" cy="13" r="2" fill="%23000000"/><path d="M15 25 Q20 30 25 25" stroke="%23000000" stroke-width="2" fill="none"/><rect x="15" y="30" width="10" height="10" fill="%231E90FF" rx="2"/></svg>';
        
        const pipeTopImg = new Image();
        pipeTopImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="200"><rect x="0" y="0" width="60" height="200" fill="%2332CD32"/><rect x="0" y="0" width="60" height="20" fill="%23228B22"/></svg>';
        
        const pipeBottomImg = new Image();
        pipeBottomImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="200"><rect x="0" y="0" width="60" height="200" fill="%2332CD32"/><rect x="0" y="180" width="60" height="20" fill="%23228B22"/></svg>';
        
        // Background object
        const background = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: canvas.height,
            draw: function() {
                ctx.drawImage(bgImg, this.x, this.y, this.width, this.height);
            }
        };
        
        // Girl object
        const girl = {
            x: 50,
            y: canvas.height / 2 - 10,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10,
            draw: function() {
                ctx.drawImage(girlImg, this.x, this.y, this.width, this.height);
            },
            update: function() {
                if (gameState === 'playing') {
                    this.velocity += this.gravity;
                    this.y += this.velocity;
                    
                    // Floor collision
                    if (this.y + this.height >= canvas.height - ground.height) {
                        this.y = canvas.height - ground.height - this.height;
                        if (gameState === 'playing') {
                            gameOver();
                        }
                    }
                    
                    // Ceiling collision
                    if (this.y <= 0) {
                        this.y = 0;
                        this.velocity = 0;
                    }
                }
            },
            flap: function() {
                this.velocity = this.jump;
            },
            reset: function() {
                this.y = canvas.height / 2 - 10;
                this.velocity = 0;
            }
        };
        
        // Ground object
        const ground = {
            x: 0,
            y: canvas.height - 20,
            width: canvas.width,
            height: 20,
            draw: function() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw grass on top
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(this.x, this.y, this.width, 5);
            }
        };
        
        // Pipes array
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: -150,
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Top pipe
                    ctx.drawImage(pipeTopImg, p.x, p.y, p.width, p.height);
                    
                    // Bottom pipe
                    ctx.drawImage(pipeBottomImg, p.x, p.y + p.height + this.gap, p.width, p.height);
                }
            },
            
            update: function() {
                if (gameState !== 'playing') return;
                
                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: this.maxYPos * (Math.random() + 1),
                        width: 60,
                        height: 200
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    
                    // Move pipes to the left
                    p.x -= this.dx;
                    
                    // If pipe goes off screen, remove it and add score
                    if (p.x + p.width <= 0) {
                        this.position.shift();
                        score++;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                    
                    // Collision detection
                    // Top pipe
                    if (girl.x + girl.width > p.x && girl.x < p.x + p.width && girl.y < p.y + p.height) {
                        gameOver();
                    }
                    
                    // Bottom pipe
                    if (girl.x + girl.width > p.x && girl.x < p.x + p.width && girl.y + girl.height > p.y + p.height + this.gap) {
                        gameOver();
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };
        
        // Game functions
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        function resetGame() {
            score = 0;
            frames = 0;
            girl.reset();
            pipes.reset();
            scoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'none';
            gameState = 'playing';
        }
        
        function startGame() {
            startScreen.style.display = 'none';
            gameState = 'playing';
            resetGame();
        }
        
        // Draw everything
        function draw() {
            background.draw();
            pipes.draw();
            ground.draw();
            girl.draw();
        }
        
        // Update game objects
        function update() {
            girl.update();
            pipes.update();
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            frames++;
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'playing') {
                    girl.flap();
                } else if (gameState === 'gameover') {
                    resetGame();
                }
            }
        });
        
        canvas.addEventListener('click', function() {
            if (gameState === 'playing') {
                girl.flap();
            }
        });
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
