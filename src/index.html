<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Flapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <div id="instructions">Press SPACE or tap to flap</div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        
        // Girl properties
        const girl = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            gravity: 0.5,
            velocity: 0,
            jump: -10
        };
        
        // Obstacles
        let obstacles = [];
        const obstacleWidth = 60;
        const gap = 150;
        const obstacleSpeed = 3;
        
        // Ground
        const groundHeight = 100;
        
        // Game functions
        function drawGirl() {
            // Draw girl body (simple representation)
            ctx.fillStyle = '#FF69B4'; // Pink color for girl
            ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
            
            // Draw head
            ctx.fillStyle = '#FFD700'; // Yellow head
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw eyes
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2 - 5, girl.y - 12, 3, 0, Math.PI * 2);
            ctx.arc(girl.x + girl.width/2 + 5, girl.y - 12, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw smile
            ctx.beginPath();
            ctx.arc(girl.x + girl.width/2, girl.y - 5, 5, 0, Math.PI);
            ctx.stroke();
        }
        
        function drawObstacle(x, topHeight) {
            // Draw top obstacle
            ctx.fillStyle = '#228B22'; // Green color for obstacles
            ctx.fillRect(x, 0, obstacleWidth, topHeight);
            
            // Draw bottom obstacle
            const bottomY = topHeight + gap;
            const bottomHeight = canvas.height - groundHeight - bottomY;
            ctx.fillRect(x, bottomY, obstacleWidth, bottomHeight);
            
            // Add some details to obstacles
            ctx.fillStyle = '#006400';
            ctx.fillRect(x - 2, topHeight - 10, obstacleWidth + 4, 10); // Top cap
            ctx.fillRect(x - 2, bottomY, obstacleWidth + 4, 10); // Bottom cap
        }
        
        function drawGround() {
            ctx.fillStyle = '#8B4513'; // Brown ground
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Draw grass on top
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);
        }
        
        function updateGirl() {
            // Apply gravity
            girl.velocity += girl.gravity;
            girl.y += girl.velocity;
            
            // Floor collision
            if (girl.y + girl.height > canvas.height - groundHeight) {
                girl.y = canvas.height - groundHeight - girl.height;
                gameOver();
            }
            
            // Ceiling collision
            if (girl.y < 0) {
                girl.y = 0;
                girl.velocity = 0;
            }
        }
        
        function updateObstacles() {
            // Move obstacles
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= obstacleSpeed;
                
                // Check if passed obstacle
                if (!obstacles[i].passed && obstacles[i].x + obstacleWidth < girl.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
                
                // Remove off-screen obstacles
                if (obstacles[i].x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }
            
            // Add new obstacle
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 200) {
                const topHeight = Math.floor(Math.random() * (canvas.height - groundHeight - gap - 100)) + 50;
                obstacles.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    passed: false
                });
            }
        }
        
        function checkCollisions() {
            // Check collision with obstacles
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                
                // Collision detection
                if (
                    girl.x + girl.width > obs.x &&
                    girl.x < obs.x + obstacleWidth &&
                    (girl.y < obs.topHeight || girl.y + girl.height > obs.topHeight + gap)
                ) {
                    gameOver();
                    return;
                }
            }
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        function resetGame() {
            girl.y = canvas.height / 2;
            girl.velocity = 0;
            obstacles = [];
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'none';
            gameRunning = true;
        }
        
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sky background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw clouds
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.arc(120, 70, 25, 0, Math.PI * 2);
            ctx.arc(140, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 120, 20, 0, Math.PI * 2);
            ctx.arc(320, 110, 25, 0, Math.PI * 2);
            ctx.arc(340, 120, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw obstacles
            obstacles.forEach(obs => {
                drawObstacle(obs.x, obs.topHeight);
            });
            
            // Draw ground
            drawGround();
            
            // Draw girl
            drawGirl();
        }
        
        function gameLoop() {
            if (gameRunning) {
                updateGirl();
                updateObstacles();
                checkCollisions();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    resetGame();
                } else {
                    girl.velocity = girl.jump;
                }
            }
        });
        
        canvas.addEventListener('click', () => {
            if (!gameRunning) {
                resetGame();
            } else {
                girl.velocity = girl.jump;
            }
        });
        
        restartBtn.addEventListener('click', resetGame);
        
        // Start the game loop
        gameLoop();
        
        // Initial draw
        draw();
    </script>
</body>
</html>
